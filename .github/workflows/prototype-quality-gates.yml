  # Package 3A additive proof only. The accepted-base selector controls this
  # diagnostic call, while the reusable workflow keeps its direct triggers
  # authoritative and treats this invocation as non-authoritative evidence.
  visual-proof:
    needs: ci-selection-shadow
    if: github.event_name == 'pull_request' && needs.ci-selection-shadow.outputs.visual_package_required == 'true'
    uses: ./.github/workflows/visual-package-validation.yml
    with:
      non_authoritative: true

  portable-receipt-shadow:
    needs:
      - ci-selection-shadow
      - quality-gates
    if: github.event_name == 'pull_request' && needs.ci-selection-shadow.outputs.portable_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.receipt_artifact.outputs.artifact-id }}
      artifact_name: ${{ steps.receipt_identity.outputs.artifact_name }}
      artifact_digest: sha256:${{ steps.receipt_artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Download exact selector evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.ci-selection-shadow.outputs.selector_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/aetheln-portable-selector
      - name: Download exact portable evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.quality-gates.outputs.report_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/aetheln-portable-evidence
      - name: Publish portable acceptance receipt
        id: receipt_identity
        shell: powershell
        env:
          AETHELN_REPOSITORY: ${{ github.repository }}
          AETHELN_ACTOR: ${{ github.actor }}
          AETHELN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AETHELN_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          AETHELN_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          AETHELN_TESTED_REVISION: ${{ github.sha }}
          AETHELN_RUN_ID: ${{ github.run_id }}
          AETHELN_RUN_ATTEMPT: ${{ github.run_attempt }}
          AETHELN_RAW_ARTIFACT_ID: ${{ needs.quality-gates.outputs.report_artifact_id }}
          AETHELN_RAW_ARTIFACT_NAME: ${{ needs.quality-gates.outputs.report_artifact_name }}
          AETHELN_RAW_ARTIFACT_DIGEST: ${{ needs.quality-gates.outputs.report_artifact_digest }}
          AETHELN_EVIDENCE_SHA256: ${{ needs.quality-gates.outputs.report_sha256 }}
          AETHELN_EVIDENCE_SIZE_BYTES: ${{ needs.quality-gates.outputs.report_size_bytes }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:AETHELN_RAW_ARTIFACT_ID -cnotmatch '\A[1-9][0-9]{0,19}\z' -or
              $env:AETHELN_RAW_ARTIFACT_NAME -cne 'ci-report' -or
              $env:AETHELN_RAW_ARTIFACT_DIGEST -cnotmatch '\Asha256:[0-9a-f]{64}\z') { throw 'portable_raw_artifact_binding_invalid' }
          $ContextPath = Join-Path '${{ runner.temp }}' 'aetheln-portable-identity.json'
          $OutputRoot = Join-Path '${{ runner.temp }}' ('ci-receipt-portable-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT + '-${{ needs.ci-selection-shadow.outputs.attempt_nonce }}')
          $WorkflowPath = (Resolve-Path -LiteralPath '.github/workflows/prototype-quality-gates.yml').Path
          $ContextBuilder = (Resolve-Path -LiteralPath 'scripts/ci/New-CiAcceptanceAggregateContext.ps1').Path
          & $ContextBuilder `
            -Mode Identity `
            -SelectorReportPath '${{ runner.temp }}/aetheln-portable-selector/ci-selection-shadow.json' `
            -WorkflowPath $WorkflowPath `
            -Repository $env:AETHELN_REPOSITORY `
            -Actor $env:AETHELN_ACTOR `
            -TriggeringActor $env:AETHELN_TRIGGERING_ACTOR `
            -BaseRevision $env:AETHELN_BASE_REVISION `
            -HeadRevision $env:AETHELN_HEAD_REVISION `
            -TestedRevision $env:AETHELN_TESTED_REVISION `
            -WorkflowId $env:AETHELN_ACCEPTANCE_WORKFLOW_ID `
            -RunId $env:AETHELN_RUN_ID `
            -RunAttempt ([int] $env:AETHELN_RUN_ATTEMPT) `
            -ActionItemsJson $env:AETHELN_ACCEPTANCE_ACTION_ITEMS_JSON `
            -IdentityContextOutputPath $ContextPath | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ci/Publish-CiAcceptanceReceipt.ps1 `
            -ContextPath $ContextPath `
            -ProducerKey portable `
            -JobName portable-receipt-shadow `
            -EvidenceRoot '${{ runner.temp }}/aetheln-portable-evidence' `
            -ExpectedEvidenceSha256 $env:AETHELN_EVIDENCE_SHA256 `
            -ExpectedEvidenceSizeBytes ([long] $env:AETHELN_EVIDENCE_SIZE_BYTES) `
            -OutputRoot $OutputRoot
          if ($LASTEXITCODE -ne 0) { throw 'portable_receipt_failed' }
          $Utf8 = New-Object Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('artifact_name=' + (Split-Path -Leaf $OutputRoot) + "`n"), $Utf8)
      - name: Upload portable acceptance receipt
        id: receipt_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.receipt_identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.receipt_identity.outputs.artifact_name }}
          if-no-files-found: error

