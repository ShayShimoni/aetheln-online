name: Prototype quality gates

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  AETHELN_ACCEPTANCE_WORKFLOW_ID: '326989724'
  AETHELN_ACCEPTANCE_ACTION_ITEMS_JSON: >-
    [{"uses":"actions/checkout","revision":"3d3c42e5aac5ba805825da76410c181273ba90b1"},{"uses":"actions/download-artifact","revision":"d3f86a106a0bac45b974a628896c90dbdf5c8093"},{"uses":"actions/upload-artifact","revision":"043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"}]

jobs:
  # Issue #167 accepted-base shadow selector with Package 3C current-attempt
  # wiring. This independent PR-only diagnostic exposes all eight decisions,
  # the validated nonce, aggregate readiness, and direct selector artifact
  # identity to additive visual, receipt, and aggregate jobs only. Every
  # consumer remains non-authoritative; the authority boundary is hard-skipped.
  # The immutable base, head,
  # and synthetic merge objects enter a bare control repository before the
  # only checkout, which sparsely materializes the accepted-base controller.
  # Candidate selector bytes are never checked out or executed. During the
  # bootstrap PR the accepted base has no controller, so a bounded,
  # conservative accepted_controller_unavailable record selects every check
  # without claiming equivalence or authorizing any later checkout.
  ci-selection-shadow:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      attempt_nonce: ${{ steps.selection.outputs.attempt_nonce }}
      aggregate_ready: ${{ steps.selection.outputs.aggregate_ready }}
      clean_package_provenance_smoke_required: ${{ steps.selection.outputs.clean_package_provenance_smoke_required }}
      content_reference_validation_required: ${{ steps.selection.outputs.content_reference_validation_required }}
      controller_contract_required: ${{ steps.selection.outputs.controller_contract_required }}
      controller_operational_proof_required: ${{ steps.selection.outputs.controller_operational_proof_required }}
      native_client_server_compile_required: ${{ steps.selection.outputs.native_client_server_compile_required }}
      portable_required: ${{ steps.selection.outputs.portable_required }}
      unreal_editor_automation_required: ${{ steps.selection.outputs.unreal_editor_automation_required }}
      visual_package_required: ${{ steps.selection.outputs.visual_package_required }}
      selector_artifact_id: ${{ steps.selector_artifact.outputs.artifact-id }}
      selector_artifact_name: ${{ steps.selection.outputs.selector_artifact_name }}
      selector_artifact_digest: sha256:${{ steps.selector_artifact.outputs.artifact-digest }}
    env:
      AETHELN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      AETHELN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AETHELN_WORKFLOW_SHA: ${{ github.sha }}
      AETHELN_REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
      AETHELN_ACCEPTED_CONTROL: ${{ github.workspace }}/ci-selection-control-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fetch immutable comparison objects
        id: comparison
        shell: powershell
        env:
          AETHELN_GITHUB_TOKEN: ${{ github.token }}
          AETHELN_CONTROL_REPO: ${{ runner.temp }}/ci-selection-objects-${{ github.run_id }}-${{ github.run_attempt }}.git
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $BaseSha = [string] $env:AETHELN_PR_BASE_SHA
          $HeadSha = [string] $env:AETHELN_PR_HEAD_SHA
          $WorkflowSha = [string] $env:AETHELN_WORKFLOW_SHA
          foreach ($Revision in @($BaseSha, $HeadSha, $WorkflowSha)) {
            if ($Revision -cnotmatch '^[0-9a-f]{40}$') { throw 'invalid_revision' }
          }
          if (Test-Path -LiteralPath $env:AETHELN_CONTROL_REPO) { throw 'control_repository_preexists' }

          if ([string]::IsNullOrWhiteSpace($env:AETHELN_GITHUB_TOKEN)) { throw 'github_token_unavailable' }
          $Authorization = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes("x-access-token:$env:AETHELN_GITHUB_TOKEN")
          )
          Write-Output "::add-mask::$Authorization"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $Authorization"

          & git init --bare $env:AETHELN_CONTROL_REPO
          if ($LASTEXITCODE -ne 0) { throw 'control_repository_init_failed' }
          $Remote = [string] $env:AETHELN_REMOTE_URL
          try {
            foreach ($Fetch in @(
              @($BaseSha, 'refs/aetheln/base'),
              @($HeadSha, 'refs/aetheln/head'),
              @($WorkflowSha, 'refs/aetheln/workflow')
            )) {
              & git --git-dir=$env:AETHELN_CONTROL_REPO fetch --no-tags $Remote "+$($Fetch[0]):$($Fetch[1])"
              if ($LASTEXITCODE -ne 0) { throw 'immutable_object_fetch_failed' }
              $ResolvedOutput = @(& git --git-dir=$env:AETHELN_CONTROL_REPO rev-parse $Fetch[1] | ForEach-Object { "$_" })
              if ($LASTEXITCODE -ne 0 -or $ResolvedOutput.Count -ne 1 -or [string] $ResolvedOutput[0] -cne $Fetch[0]) { throw 'immutable_object_identity_mismatch' }
            }
          }
          finally {
            $env:GIT_CONFIG_COUNT = $null
            $env:GIT_CONFIG_KEY_0 = $null
            $env:GIT_CONFIG_VALUE_0 = $null
          }
          $Shallow = @(& git --git-dir=$env:AETHELN_CONTROL_REPO rev-parse --is-shallow-repository | ForEach-Object { "$_" })
          if ($LASTEXITCODE -ne 0 -or $Shallow.Count -ne 1 -or $Shallow[0] -cne 'false') { throw 'comparison_ancestry_incomplete' }
          $ParentOutput = @(& git --git-dir=$env:AETHELN_CONTROL_REPO show -s --format=%P $WorkflowSha | ForEach-Object { "$_" })
          if ($LASTEXITCODE -ne 0 -or $ParentOutput.Count -ne 1 -or $ParentOutput[0] -cnotmatch '^[0-9a-f]{40} [0-9a-f]{40}$') { throw 'workflow_revision_parents_invalid' }
          $Parents = $ParentOutput[0].Split(' ')
          $AcceptedSha = [string] $Parents[0]
          if ($AcceptedSha -ceq $HeadSha -or $Parents[1] -cne $HeadSha) { throw 'workflow_revision_parents_invalid' }
          & git --git-dir=$env:AETHELN_CONTROL_REPO merge-base --is-ancestor $BaseSha $AcceptedSha
          if ($LASTEXITCODE -ne 0) { throw 'event_base_not_accepted_ancestor' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "accepted_base_sha=$AcceptedSha`n", (New-Object Text.UTF8Encoding($false)))
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.comparison.outputs.accepted_base_sha }}
          path: ci-selection-control-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout: scripts/ci/Get-CiSelection.ps1
          sparse-checkout-cone-mode: false
      - name: Produce shadow selection record
        id: selection
        shell: powershell
        env:
          AETHELN_CONTROL_REPO: ${{ runner.temp }}/ci-selection-objects-${{ github.run_id }}-${{ github.run_attempt }}.git
          AETHELN_SHADOW_REPORT: ${{ runner.temp }}/ci-selection-shadow.json
          AETHELN_ACCEPTED_BASE_SHA: ${{ steps.comparison.outputs.accepted_base_sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $BaseSha = [string] $env:AETHELN_PR_BASE_SHA
          $HeadSha = [string] $env:AETHELN_PR_HEAD_SHA
          $WorkflowSha = [string] $env:AETHELN_WORKFLOW_SHA
          $AcceptedSha = [string] $env:AETHELN_ACCEPTED_BASE_SHA
          if ($AcceptedSha -cnotmatch '^[0-9a-f]{40}$' -or $AcceptedSha -ceq $HeadSha) { throw 'accepted_base_invalid' }
          $SelectorPath = Join-Path $env:AETHELN_ACCEPTED_CONTROL 'scripts/ci/Get-CiSelection.ps1'
          $ContextPath = Join-Path '${{ runner.temp }}' 'ci-selection-context.json'
          $Utf8 = New-Object System.Text.UTF8Encoding $false
          $ControllerBlobOid = $null
          $ControllerSha256 = $null

          function Invoke-BoundedProcessToFile {
            param(
              [Parameter(Mandatory)] [string] $FileName,
              [Parameter(Mandatory)] [string] $Arguments,
              [Parameter(Mandatory)] [string] $OutputPath,
              [ValidateRange(100, 120000)] [int] $TimeoutMilliseconds = 120000
            )
            $FullOutputPath = [IO.Path]::GetFullPath($OutputPath)
            $OutputParent = Split-Path -Parent $FullOutputPath
            if (-not (Test-Path -LiteralPath $OutputParent -PathType Container)) { throw 'bounded_process_output_parent_missing' }
            $TemporaryPath = Join-Path $OutputParent ('.accepted-controller-' + [guid]::NewGuid().ToString('N') + '.tmp')
            $StartInfo = New-Object Diagnostics.ProcessStartInfo
            $StartInfo.FileName = $FileName
            $StartInfo.Arguments = $Arguments
            $StartInfo.UseShellExecute = $false
            $StartInfo.CreateNoWindow = $true
            $StartInfo.RedirectStandardOutput = $true
            $StartInfo.RedirectStandardError = $true
            $Process = New-Object Diagnostics.Process
            $Process.StartInfo = $StartInfo
            $OutputStream = $null
            try {
              $OutputStream = New-Object IO.FileStream($TemporaryPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
              if (-not $Process.Start()) { throw 'bounded_process_start_failed' }
              $OutputCopy = $Process.StandardOutput.BaseStream.CopyToAsync($OutputStream)
              $ErrorRead = $Process.StandardError.ReadToEndAsync()
              if (-not $Process.WaitForExit($TimeoutMilliseconds)) {
                try { $Process.Kill() } catch { }
                if (-not $Process.WaitForExit(5000)) { throw 'bounded_process_termination_failed' }
                try { [void] $OutputCopy.GetAwaiter().GetResult() } catch { }
                try { [void] $ErrorRead.GetAwaiter().GetResult() } catch { }
                throw 'bounded_process_timeout'
              }
              [void] $OutputCopy.GetAwaiter().GetResult()
              $ErrorText = $ErrorRead.GetAwaiter().GetResult()
              if ($Process.ExitCode -ne 0) { throw "bounded_process_failed:$($Process.ExitCode):$ErrorText" }
              $OutputStream.Flush($true)
              $OutputStream.Dispose()
              $OutputStream = $null
              [IO.File]::Copy($TemporaryPath, $FullOutputPath, $true)
            }
            finally {
              if ($null -ne $OutputStream) { $OutputStream.Dispose() }
              $Process.Dispose()
              if (Test-Path -LiteralPath $TemporaryPath -PathType Leaf) { Remove-Item -LiteralPath $TemporaryPath -Force }
            }
          }

          $Context = [ordered]@{
            kind = 'pull_request'
            runId = '${{ github.run_id }}'
            runAttempt = [int] '${{ github.run_attempt }}'
            baseRevision = $AcceptedSha
            headRevision = $HeadSha
            workflowRevision = $WorkflowSha
            controllerRevision = $AcceptedSha
          }

          function Assert-CurrentAttemptAnchor {
            param(
              [Parameter(Mandatory)] $Anchor,
              [Parameter(Mandatory)] [string] $ExpectedRunId,
              [Parameter(Mandatory)] [int] $ExpectedRunAttempt
            )
            $ExpectedProperties = 'schemaVersion,runId,runAttempt,nonce'
            if ($Anchor -isnot [pscustomobject] -or
                ($Anchor.PSObject.Properties.Name -join ',') -cne $ExpectedProperties -or
                $Anchor.schemaVersion -isnot [string] -or
                $Anchor.schemaVersion -cne 'aetheln.current-attempt-anchor/v1' -or
                $Anchor.runId -isnot [string] -or
                $Anchor.runId -cnotmatch '\A[0-9]+\z' -or
                $Anchor.runId -cne $ExpectedRunId -or
                ($Anchor.runAttempt -isnot [int] -and $Anchor.runAttempt -isnot [long]) -or
                [long] $Anchor.runAttempt -ne [long] $ExpectedRunAttempt -or
                $Anchor.nonce -isnot [string] -or
                $Anchor.nonce -cnotmatch '\A[0-9a-f]{64}\z' -or
                $Anchor.nonce -ceq ('0' * 64)) {
              throw 'shadow_report_attempt_anchor_invalid'
            }
            return [string] $Anchor.nonce
          }
          [IO.File]::WriteAllText($ContextPath, (ConvertTo-Json -InputObject $Context -Compress), $Utf8)

          $BlobQuery = "${AcceptedSha}:scripts/ci/Get-CiSelection.ps1"
          $PreviousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $BlobOutput = @(& git --git-dir=$env:AETHELN_CONTROL_REPO rev-parse $BlobQuery 2>$null | ForEach-Object { "$_" })
            $BlobExitCode = $LASTEXITCODE
          }
          finally { $ErrorActionPreference = $PreviousPreference }
          if ($BlobExitCode -eq 0 -and $BlobOutput.Count -eq 1) { $ControllerBlobOid = [string] $BlobOutput[0] }

          if ($BlobExitCode -eq 0 -and $ControllerBlobOid -cmatch '^[0-9a-f]{40,64}$') {
            if (-not (Test-Path -LiteralPath $SelectorPath -PathType Leaf)) { throw 'accepted_controller_checkout_missing' }
            if ($env:AETHELN_CONTROL_REPO.Contains('"')) { throw 'control_repository_path_invalid' }
            $MaterializeArguments = "--git-dir=`"$env:AETHELN_CONTROL_REPO`" cat-file blob $ControllerBlobOid"
            Invoke-BoundedProcessToFile -FileName 'git' -Arguments $MaterializeArguments -OutputPath $SelectorPath -TimeoutMilliseconds 120000
            $CheckedOutBlob = [string] @(& git -C $env:AETHELN_ACCEPTED_CONTROL hash-object --no-filters -- scripts/ci/Get-CiSelection.ps1)[0]
            if ($LASTEXITCODE -ne 0 -or $CheckedOutBlob -cne $ControllerBlobOid) { throw 'accepted_controller_byte_mismatch' }
            $ControllerSha256 = (Get-FileHash -LiteralPath $SelectorPath -Algorithm SHA256).Hash.ToLowerInvariant()
            powershell -NoProfile -File $SelectorPath -ContextJson $ContextPath -OutputPath $env:AETHELN_SHADOW_REPORT -RepositoryRoot $env:AETHELN_CONTROL_REPO
            if ($LASTEXITCODE -ne 0) { throw 'accepted_controller_failed' }
          }
          else {
            $NonceBytes = [byte[]]::new(32)
            $Generator = $null
            try {
              $Generator = [Security.Cryptography.RandomNumberGenerator]::Create()
              $Generator.GetBytes($NonceBytes)
            }
            catch { throw 'attempt_anchor_rng_failed' }
            finally { if ($null -ne $Generator) { $Generator.Dispose() } }
            $Nonce = [BitConverter]::ToString($NonceBytes).Replace('-', '').ToLowerInvariant()
            if ($Nonce -ceq ('0' * 64)) { throw 'attempt_anchor_rng_invalid' }
            $CheckIds = @(
              'portable',
              'visual-package',
              'native-client-server-compile',
              'unreal-editor-automation',
              'content-reference-validation',
              'controller-contract',
              'controller-operational-proof',
              'clean-package-provenance-smoke'
            )
            $Obligations = @($CheckIds | ForEach-Object {
              [ordered]@{ id = $_; selected = $true; reasons = @('accepted_controller_unavailable') }
            })
            $Report = [ordered]@{
              schemaVersion = 'aetheln.ci-selection/v1'
              attemptAnchor = [ordered]@{ schemaVersion = 'aetheln.current-attempt-anchor/v1'; runId = '${{ github.run_id }}'; runAttempt = [int] '${{ github.run_attempt }}'; nonce = $Nonce }
              policy = [ordered]@{ version = 'shadow-v1'; digest = ('0' * 64); checkIds = $CheckIds }
              source = [ordered]@{ kind = 'pull_request'; callerKind = $null; baseRevision = $AcceptedSha; headRevision = $HeadSha; workflowRevision = $WorkflowSha; revision = $null }
              execution = [ordered]@{
                mode = 'accepted_controller_unavailable'
                controllerRevision = $AcceptedSha
                controllerBlobOid = $null
                controllerSha256 = $null
                checkoutAllowed = $false
                complete = $true
                reason = 'accepted_controller_unavailable'
              }
              classification = [ordered]@{ changedPaths = @(); entries = @(); uncertainties = @('accepted_controller_unavailable') }
              selection = [ordered]@{ shadow = $true; authoritative = $false; obligations = $Obligations }
              legacyAuthority = [ordered]@{ authoritative = $true; engineRequired = $null; reason = 'not_observed' }
              comparison = [ordered]@{ status = 'unavailable'; differences = @('accepted_controller_unavailable') }
            }
            [IO.File]::WriteAllText($env:AETHELN_SHADOW_REPORT, ((ConvertTo-Json -InputObject $Report -Depth 8) + "`n"), $Utf8)
          }

          if (-not (Test-Path -LiteralPath $env:AETHELN_SHADOW_REPORT -PathType Leaf)) { throw 'shadow_report_missing' }
          $ReportInfo = Get-Item -LiteralPath $env:AETHELN_SHADOW_REPORT
          if ($ReportInfo.Length -le 0 -or $ReportInfo.Length -gt 4MB) { throw 'shadow_report_size_invalid' }
          $Parsed = Get-Content -LiteralPath $env:AETHELN_SHADOW_REPORT -Raw | ConvertFrom-Json
          if ($Parsed.selection.shadow -ne $true -or $Parsed.selection.authoritative -ne $false) { throw 'shadow_report_authority_invalid' }
          $ExpectedRunId = [string] '${{ github.run_id }}'
          $ExpectedRunAttempt = [int] '${{ github.run_attempt }}'
          $AttemptNonce = Assert-CurrentAttemptAnchor -Anchor $Parsed.attemptAnchor -ExpectedRunId $ExpectedRunId -ExpectedRunAttempt $ExpectedRunAttempt
          if ($null -ne $ControllerBlobOid) {
            if ([string] $Parsed.execution.controllerBlobOid -cne $ControllerBlobOid -or [string] $Parsed.execution.controllerSha256 -cne $ControllerSha256) {
              throw 'shadow_report_controller_identity_mismatch'
            }
          }
          $ExpectedObligations = [ordered]@{
            'portable' = 'portable_required'
            'visual-package' = 'visual_package_required'
            'native-client-server-compile' = 'native_client_server_compile_required'
            'unreal-editor-automation' = 'unreal_editor_automation_required'
            'content-reference-validation' = 'content_reference_validation_required'
            'controller-contract' = 'controller_contract_required'
            'controller-operational-proof' = 'controller_operational_proof_required'
            'clean-package-provenance-smoke' = 'clean_package_provenance_smoke_required'
          }
          $LiveProducerChecks = @('controller-contract', 'controller-operational-proof', 'native-client-server-compile', 'portable', 'unreal-editor-automation', 'visual-package')
          $Obligations = @($Parsed.selection.obligations)
          if ($Obligations.Count -ne $ExpectedObligations.Count) { throw 'shadow_selection_obligations_invalid' }
          $AggregateReady = $true
          $ObligationIds = @($ExpectedObligations.Keys)
          for ($Index = 0; $Index -lt $ObligationIds.Count; $Index++) {
            $ExpectedId = [string] $ObligationIds[$Index]
            $Obligation = $Obligations[$Index]
            if ($Obligation -isnot [pscustomobject] -or
                ($Obligation.PSObject.Properties.Name -join ',') -cne 'id,selected,reasons' -or
                $Obligation.id -isnot [string] -or $Obligation.id -cne $ExpectedId -or
                $Obligation.selected -isnot [bool] -or $Obligation.reasons -isnot [array] -or
                ($Obligation.selected -and @($Obligation.reasons).Count -eq 0) -or
                (-not $Obligation.selected -and @($Obligation.reasons).Count -ne 0)) {
              throw 'shadow_selection_obligations_invalid'
            }
            if (@($Obligation.reasons | Where-Object { $_ -isnot [string] -or $_.Length -lt 1 -or $_.Length -gt 4096 }).Count -ne 0) {
              throw 'shadow_selection_obligations_invalid'
            }
            $SelectedText = ([bool] $Obligation.selected).ToString().ToLowerInvariant()
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ([string] $ExpectedObligations[$ExpectedId] + "=$SelectedText`n"), $Utf8)
            if ($Obligation.selected -and $LiveProducerChecks -cnotcontains $ExpectedId) { $AggregateReady = $false }
          }
          $ArtifactName = "ci-selection-shadow-$ExpectedRunId-$ExpectedRunAttempt-$AttemptNonce"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "attempt_nonce=$AttemptNonce`n", $Utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('aggregate_ready=' + $AggregateReady.ToString().ToLowerInvariant() + "`n"), $Utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "selector_artifact_name=$ArtifactName`n", $Utf8)
          exit 0
      - name: Upload shadow selection record
        id: selector_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.selection.outputs.selector_artifact_name }}
          path: ${{ runner.temp }}/ci-selection-shadow.json
          if-no-files-found: error

  quality-gates:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      report_artifact_id: ${{ steps.report_artifact.outputs.artifact-id }}
      report_artifact_name: ${{ steps.report_identity.outputs.artifact_name }}
      report_artifact_digest: sha256:${{ steps.report_artifact.outputs.artifact-digest }}
      report_sha256: ${{ steps.report_identity.outputs.evidence_sha256 }}
      report_size_bytes: ${{ steps.report_identity.outputs.evidence_size_bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
      - name: Fetch StarterMap LFS object
        shell: powershell
        run: git lfs pull --include "Content/Maps/StarterMap.umap"
      - name: Run CI suite
        shell: powershell
        run: powershell -NoProfile -File scripts/ci/Invoke-CiSuite.ps1
      - name: Bind machine-readable report
        id: report_identity
        if: always()
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ReportPath = Join-Path '${{ github.workspace }}' 'TestResults/ci-report.json'
          if (-not (Test-Path -LiteralPath $ReportPath -PathType Leaf)) { throw 'ci_report_missing' }
          $Report = Get-Item -LiteralPath $ReportPath
          if ($Report.Length -le 0 -or $Report.Length -gt 4MB) { throw 'ci_report_size_invalid' }
          $Digest = (Get-FileHash -LiteralPath $ReportPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $Utf8 = New-Object Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "artifact_name=ci-report`nevidence_sha256=$Digest`nevidence_size_bytes=$($Report.Length)`n", $Utf8)
      - name: Upload machine-readable report
        id: report_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.report_identity.outputs.artifact_name }}
          path: TestResults/ci-report.json
          if-no-files-found: error

  # Issue #150 pull-request change-impact classifier. GitHub-hosted, checkout
  # plus repository-owned PowerShell only. It compares the exact pull-request
  # base and head SHAs (passed through env, never interpolated into the
  # script) and skips trusted Unreal compilation only when every changed path
  # belongs to the closed portable-only set. Every uncertainty — invalid or
  # missing SHAs, unreachable commits, Git errors, an empty diff, a quoted or
  # rename/copy diff entry — fails closed to engine_required=true, and the
  # step always exits 0 so the decision is always published.
  change-impact:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      engine_required: ${{ steps.classify.outputs.engine_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
      - name: Classify changed paths
        id: classify
        shell: powershell
        env:
          AETHELN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AETHELN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $EngineRequired = $true
          $Reason = 'classifier_error'
          $Detail = ''

          function Invoke-GitRaw([string[]] $Arguments) {
            $Previous = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $Output = @(& git @Arguments 2>&1 | ForEach-Object { "$_" })
              $ExitCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $Previous
            }
            return @{ Output = $Output; ExitCode = $ExitCode }
          }

          function Test-PortablePath([string] $Path) {
            # Closed portable-only set (case-sensitive). Compile never executes
            # these packaging scripts; their required portable suites and independent
            # review are the gates. Controller scripts and this workflow compile
            # (TA-018) so the native producer can publish controller-operational-proof.
            # Other scripts/workflows and all engine inputs still require compile.
            $PortableCiPaths = @(
              'scripts/build/Build-PackagedArtifacts.ps1',
              'scripts/build/Invoke-PackagedSmokeTest.ps1'
            )
            if ($PortableCiPaths -ccontains $Path) { return $true }
            if ($Path -cmatch '^docs/.+') { return $true }
            if ($Path -cmatch '^visuals/.+') { return $true }
            if ($Path -cmatch '^output/pdf/.+') { return $true }
            if ($Path -cmatch '^tests/.+\.(ps1|md)$') { return $true }
            if ($Path -cmatch '^[^/]+\.md$') { return $true }
            if ($Path -cmatch '^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/[^/]+\.(md|yml|yaml)$') { return $true }
            if ($Path -cmatch '^\.github/(PULL_REQUEST_TEMPLATE|pull_request_template)\.md$') { return $true }
            return $false
          }

          try {
            $BaseSha = [string] $env:AETHELN_PR_BASE_SHA
            $HeadSha = [string] $env:AETHELN_PR_HEAD_SHA
            if ($BaseSha -cnotmatch '^[0-9a-f]{40}$' -or $HeadSha -cnotmatch '^[0-9a-f]{40}$') { throw 'invalid_sha' }
            if ($BaseSha -eq $HeadSha) { throw 'identical_shas' }
            foreach ($Revision in @($BaseSha, $HeadSha)) {
              if ((Invoke-GitRaw @('cat-file', '-e', "$Revision^{commit}")).ExitCode -ne 0) {
                $null = Invoke-GitRaw @('fetch', '--no-tags', '--depth=1', 'origin', $Revision)
                if ((Invoke-GitRaw @('cat-file', '-e', "$Revision^{commit}")).ExitCode -ne 0) { throw 'commit_unavailable' }
              }
            }
            $Diff = Invoke-GitRaw @('diff', '--name-status', '--no-renames', $BaseSha, $HeadSha)
            if ($Diff.ExitCode -ne 0) { throw 'diff_failed' }
            $Entries = @($Diff.Output | Where-Object { $_ -ne '' })
            if ($Entries.Count -eq 0) { throw 'empty_diff' }
            $EnginePaths = @()
            foreach ($Entry in $Entries) {
              if ($Entry -cnotmatch '^[AMDT]\t([^\t"]+)$') { throw 'unexpected_diff_entry' }
              if (-not (Test-PortablePath $Matches[1])) { $EnginePaths += $Matches[1] }
            }
            if ($EnginePaths.Count -gt 0) {
              $Reason = 'engine_paths_changed'
              $Detail = (@($EnginePaths | Select-Object -First 20) -join ', ')
            }
            else {
              $EngineRequired = $false
              $Reason = 'portable_paths_only'
              $Detail = "$($Entries.Count) portable path(s)"
            }
          }
          catch {
            $EngineRequired = $true
            $Message = [string] $_.Exception.Message
            $Known = @('invalid_sha', 'identical_shas', 'commit_unavailable', 'diff_failed', 'empty_diff', 'unexpected_diff_entry')
            if ($Known -contains $Message) { $Reason = $Message } else { $Reason = 'classifier_error' }
          }

          $Flag = if ($EngineRequired) { 'true' } else { 'false' }
          $Utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "engine_required=$Flag`nreason=$Reason`n", $Utf8)
          $Summary = "Change impact: engine_required=$Flag (reason: $Reason)."
          if ($Detail) { $Summary = "Change impact: engine_required=$Flag (reason: ${Reason}; $Detail)." }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$Summary`n", $Utf8)
          Write-Output $Summary
          exit 0

  # Trusted compile starts only after the portable gates passed and the
  # classifier demanded the engine (implicit success on both needs edges; no
  # status-function bypass). A portable failure, a cancellation, or a skipped
  # prerequisite keeps it off the engine runner.
  trusted-candidate-compile:
    needs:
      - quality-gates
      - change-impact
    if: >-
      github.event_name == 'pull_request' &&
      needs.change-impact.outputs.engine_required == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, aetheln-engine]
    timeout-minutes: 40
    outputs:
      report_artifact_id: ${{ steps.report_artifact.outputs.artifact-id }}
      report_artifact_name: ${{ steps.report_identity.outputs.artifact_name }}
      report_artifact_digest: sha256:${{ steps.report_artifact.outputs.artifact-digest }}
      report_sha256: ${{ steps.report_identity.outputs.evidence_sha256 }}
      report_size_bytes: ${{ steps.report_identity.outputs.evidence_size_bytes }}
      automation_artifact_id: ${{ steps.automation_artifact.outputs.artifact-id }}
      automation_artifact_name: ${{ steps.automation_identity.outputs.artifact_name }}
      automation_artifact_digest: sha256:${{ steps.automation_artifact.outputs.artifact-digest }}
      automation_sha256: ${{ steps.automation_identity.outputs.evidence_sha256 }}
      automation_size_bytes: ${{ steps.automation_identity.outputs.evidence_size_bytes }}
      automation_reason: ${{ steps.automation_outcome.outputs.reason }}
    defaults:
      run:
        working-directory: compile-control-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: aetheln-engine-runner
      queue: max
      cancel-in-progress: false
    steps:
      - name: Capture routine compile deadline
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $StartedTimestamp = [Diagnostics.Stopwatch]::GetTimestamp()
          $StartedUtc = [DateTime]::UtcNow.ToString('o', [Globalization.CultureInfo]::InvariantCulture)
          $Utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_ENV, "AETHELN_COMPILE_STARTED_UTC=$StartedUtc`nAETHELN_COMPILE_STARTED_TIMESTAMP=$StartedTimestamp`n", $Utf8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          lfs: false
          ref: ${{ github.sha }}
          path: compile-control-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Compile supported client and server targets
        shell: powershell
        env:
          AETHELN_MANAGED_COMPILE_ROOT: ${{ vars.AETHELN_MANAGED_COMPILE_ROOT }}
          AETHELN_MANAGED_COMPILE_REGISTRATION: ${{ vars.AETHELN_MANAGED_COMPILE_REGISTRATION }}
          AETHELN_MANAGED_COMPILE_REGISTRATION_SHA256: ${{ vars.AETHELN_MANAGED_COMPILE_REGISTRATION_SHA256 }}
          AETHELN_ENGINE_HOST_LEASE: ${{ vars.AETHELN_ENGINE_HOST_LEASE }}
        run: |
          $RunRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          powershell -NoProfile -File scripts/ci/Invoke-EngineRunnerGate.ps1 `
            -Mode Compile `
            -RepositoryRoot '${{ github.workspace }}/compile-control-${{ github.run_id }}-${{ github.run_attempt }}' `
            -SourceRevision '${{ github.sha }}' `
            -Repository '${{ github.repository }}' `
            -RunnerName '${{ runner.name }}' `
            -ManagedWorkspaceRoot $env:AETHELN_MANAGED_COMPILE_ROOT `
            -ManagedWorkspaceRegistrationPath $env:AETHELN_MANAGED_COMPILE_REGISTRATION `
            -ManagedWorkspaceRegistrationSha256 $env:AETHELN_MANAGED_COMPILE_REGISTRATION_SHA256 `
            -HostLeasePath $env:AETHELN_ENGINE_HOST_LEASE `
            -CompileStartedUtc $env:AETHELN_COMPILE_STARTED_UTC `
            -CompileStartedTimestamp $env:AETHELN_COMPILE_STARTED_TIMESTAMP `
            -ArchiveRoot (Join-Path $RunRoot 'archives') `
            -LogRoot (Join-Path $RunRoot 'logs') `
            -CompileTimeoutMinutes 30 `
            -ReportPath (Join-Path $RunRoot 'engine-runner-report.json')
      - name: Bind engine-runner report
        id: report_identity
        if: always()
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ReportPath = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/engine-runner-report.json'
          if (-not (Test-Path -LiteralPath $ReportPath -PathType Leaf)) { throw 'engine_report_missing' }
          $Report = Get-Item -LiteralPath $ReportPath
          if ($Report.Length -le 0 -or $Report.Length -gt 4MB) { throw 'engine_report_size_invalid' }
          $ReportStream = [IO.File]::OpenRead($ReportPath)
          $Hasher = [Security.Cryptography.SHA256]::Create()
          try { $Digest = ([BitConverter]::ToString($Hasher.ComputeHash($ReportStream))).Replace('-', '').ToLowerInvariant() }
          finally { $Hasher.Dispose(); $ReportStream.Dispose() }
          $Utf8 = New-Object Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "artifact_name=engine-runner-compile-report`nevidence_sha256=$Digest`nevidence_size_bytes=$($Report.Length)`n", $Utf8)
      - name: Upload engine-runner report
        id: report_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: engine-runner-compile-report
          path: ${{ runner.temp }}/aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/engine-runner-report.json
          if-no-files-found: error
      # Package 3C unreal-editor-automation producer. After a passing compile
      # (and its report upload), build the editor target in the same managed
      # workspace through the bounded capture wrapper, then run the frozen
      # two-test harness from that workspace. Outside the host lease by design
      # for this first proof. Every automation step continues on error, so an
      # automation failure never fails this job or skips the native receipt
      # (a whole-job ceiling overrun still cancels the job); bind and upload
      # run only after the earlier automation steps succeeded, and a missing
      # artifact fails unreal-receipt-shadow at its raw binding check. Each
      # failure records one fixed reason, exposed as automation_reason.
      # build.log, harness output, and the copied report live under runner.temp.
      - name: Build editor target for Unreal automation
        id: editor_build
        continue-on-error: true
        timeout-minutes: 15
        shell: powershell
        env:
          AETHELN_MANAGED_COMPILE_ROOT: ${{ vars.AETHELN_MANAGED_COMPILE_ROOT }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          function Exit-Automation([string] $Reason) { [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "reason=$Reason`n", (New-Object Text.UTF8Encoding $false)); throw $Reason }
          # Mask both roots in later step output. The managed root is a
          # repository variable that step env headers already display; masking
          # only keeps it and the engine root out of later output.
          if ($env:AETHELN_ENGINE_ROOT) { Write-Output "::add-mask::$env:AETHELN_ENGINE_ROOT" }
          if ($env:AETHELN_MANAGED_COMPILE_ROOT) { Write-Output "::add-mask::$env:AETHELN_MANAGED_COMPILE_ROOT" }
          # Start only if every automation step bound (build 15, harness 12,
          # residue 2, bind 1, upload 1, outcome 1) still fits inside the
          # 40-minute job, so the compile must finish within about 8 minutes
          # of the start anchor for the editor build to run.
          $Started = 0L
          if (-not [long]::TryParse([string] $env:AETHELN_COMPILE_STARTED_TIMESTAMP, [Globalization.NumberStyles]::None, [Globalization.CultureInfo]::InvariantCulture, [ref] $Started) -or $Started -le 0) { Exit-Automation 'editor_build_budget_invalid' }
          $JobSeconds = 40 * 60
          $RequiredSeconds = (15 + 12 + 2 + 1 + 1 + 1) * 60
          $ElapsedSeconds = ([Diagnostics.Stopwatch]::GetTimestamp() - $Started) / [Diagnostics.Stopwatch]::Frequency
          if ($ElapsedSeconds -lt 0) { Exit-Automation 'editor_build_budget_invalid' }
          if ($JobSeconds - $ElapsedSeconds -lt $RequiredSeconds) {
            Write-Output 'editor_build_skipped reason=editor_build_budget_exhausted'
            Exit-Automation 'editor_build_budget_exhausted'
          }
          $EvidenceRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/editor-build'
          $null = New-Item -ItemType Directory -Path $EvidenceRoot
          # The wrapper captures all build output in runner-local build.log.
          powershell -NoProfile -File scripts/ci/InitialPreparation.BuildInvocation.ps1 `
            -Target AethelnOnlineEditor `
            -Platform Win64 `
            -ActionLimit 4 `
            -EngineRoot $env:AETHELN_ENGINE_ROOT `
            -TargetRoot $env:AETHELN_MANAGED_COMPILE_ROOT `
            -LinuxToolchainRoot $env:AETHELN_LINUX_TOOLCHAIN_ROOT `
            -EvidenceRoot $EvidenceRoot
          $BuildExit = $LASTEXITCODE
          # native-result.json holds only target, platform, exit code, and failure class.
          $ResultPath = Join-Path $EvidenceRoot 'native-result.json'
          $CaptureFailed = $true
          if (Test-Path -LiteralPath $ResultPath -PathType Leaf) {
            $ResultText = [IO.File]::ReadAllText($ResultPath)
            Write-Output $ResultText
            try { $CaptureFailed = $null -ne ($ResultText | ConvertFrom-Json).infrastructureFailure } catch { $CaptureFailed = $true }
          }
          if ($BuildExit -ne 0) { if ($CaptureFailed) { Exit-Automation 'editor_build_capture_failed' } else { Exit-Automation 'editor_build_failed' } }
      - name: Run frozen Unreal automation filter
        id: automation_run
        if: steps.editor_build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        shell: powershell
        env:
          AETHELN_MANAGED_COMPILE_ROOT: ${{ vars.AETHELN_MANAGED_COMPILE_ROOT }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          function Exit-Automation([string] $Reason) { [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "reason=$Reason`n", (New-Object Text.UTF8Encoding $false)); throw $Reason }
          $RunRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          $Harness = Join-Path $env:AETHELN_MANAGED_COMPILE_ROOT 'scripts\ci\Invoke-UnrealAutomationTests.ps1'
          # Unreal and harness output carry absolute runner paths, so both streams
          # go to runner-local files and never reach this public log.
          $Arguments = @('-NoProfile', '-NonInteractive', '-File', ('"' + $Harness + '"'), '-EngineRoot', ('"' + $env:AETHELN_ENGINE_ROOT.TrimEnd('\') + '"'), '-TimeoutSeconds', '600')
          $Harnessed = Start-Process -FilePath (Join-Path $PSHOME 'powershell.exe') -ArgumentList $Arguments -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput (Join-Path $RunRoot 'unreal-automation-stdout.txt') `
            -RedirectStandardError (Join-Path $RunRoot 'unreal-automation-stderr.txt')
          $ManagedReport = Join-Path $env:AETHELN_MANAGED_COMPILE_ROOT 'TestResults\unreal-automation-report.json'
          $ReportPath = Join-Path $RunRoot 'unreal-automation-report.json'
          if (-not (Test-Path -LiteralPath $ManagedReport -PathType Leaf)) { Exit-Automation 'unreal_automation_report_missing' }
          Copy-Item -LiteralPath $ManagedReport -Destination $ReportPath
          try { $Report = [IO.File]::ReadAllText($ReportPath) | ConvertFrom-Json } catch { Exit-Automation 'unreal_automation_report_invalid' }
          # Bounded, path-free summary: the harness's fixed vocabulary and integers only.
          $KnownReasons = @('none', 'preflight', 'repository-dirty', 'engine-pin', 'process-start', 'timeout', 'editor-exit', 'missing-report', 'discovery-mismatch', 'test-failure', 'invalid-report', 'repository-drift')
          $Result = if ($Report.result -cin @('passed', 'failed')) { $Report.result } else { 'invalid' }
          $Reason = if ($KnownReasons -ccontains [string] $Report.failureReason) { [string] $Report.failureReason } else { 'invalid' }
          Write-Output ('unreal_automation result={0} reason={1} total={2} passed={3} requiredFailed={4} exit={5}' -f $Result, $Reason, [int] $Report.summary.total, [int] $Report.summary.passed, [int] $Report.summary.requiredFailed, $Harnessed.ExitCode)
          if ($Harnessed.ExitCode -ne 0 -or $Result -cne 'passed') { Exit-Automation ('unreal_automation_' + $Reason.Replace('-', '_')) }
      # The editor may write gitignored files under compile inputs, and the next
      # managed sync rejects any untracked input file. Remove exactly the set
      # that sync query reports (it runs even after a failed build or harness)
      # so later pull requests keep a clean workspace; anything left fails here.
      - name: Clear editor-written input residue
        id: automation_residue
        continue-on-error: true
        timeout-minutes: 2
        shell: powershell
        env:
          AETHELN_MANAGED_COMPILE_ROOT: ${{ vars.AETHELN_MANAGED_COMPILE_ROOT }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          function Exit-Automation([string] $Reason) { [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "reason=$Reason`n", (New-Object Text.UTF8Encoding $false)); throw $Reason }
          $Root = [IO.Path]::GetFullPath($env:AETHELN_MANAGED_COMPILE_ROOT).TrimEnd('\', '/')
          $Query = 'ls-files --others -z -- ":(icase)Source" ":(icase)Config" ":(icase)Content" ":(icase)Plugins" ":(icase)Build" ":(icase)Platforms" ":(icase)AethelnOnline.uproject" ":(icase).gitattributes" ":(icase).gitmodules" ":(icase).lfsconfig" ":(exclude,icase,glob)**/Binaries/**" ":(exclude,icase,glob)**/Intermediate/**"'
          # Same git resolution and flags as the managed sync.
          $Git = (Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          function Get-InputResidue {
            $Info = New-Object Diagnostics.ProcessStartInfo $Git, ('--no-replace-objects --no-optional-locks -C "' + $Root + '" ' + $Query)
            $Info.UseShellExecute = $false
            $Info.CreateNoWindow = $true
            $Info.RedirectStandardOutput = $true
            $Info.RedirectStandardError = $true
            $Info.StandardOutputEncoding = New-Object Text.UTF8Encoding $false
            $Process = [Diagnostics.Process]::Start($Info)
            $ErrorText = $Process.StandardError.ReadToEndAsync()
            $Text = $Process.StandardOutput.ReadToEnd()
            $Process.WaitForExit()
            $null = $ErrorText.Result
            if ($Process.ExitCode -ne 0) { Exit-Automation 'automation_input_residue_query_failed' }
            return @($Text.Split([char] 0) | Where-Object { $_ })
          }
          $Residue = @(Get-InputResidue)
          foreach ($Relative in $Residue) {
            $Path = [IO.Path]::GetFullPath((Join-Path $Root $Relative))
            if (-not $Path.StartsWith($Root + '\', [StringComparison]::OrdinalIgnoreCase)) { Exit-Automation 'automation_input_residue_path_invalid' }
            Remove-Item -LiteralPath $Path -Force
          }
          if (@(Get-InputResidue).Count -ne 0) { Exit-Automation 'automation_input_residue_remaining' }
          Write-Output ('automation_input_residue removed={0}' -f $Residue.Count)
      - name: Bind Unreal automation report
        id: automation_identity
        if: steps.editor_build.outcome == 'success' && steps.automation_run.outcome == 'success' && steps.automation_residue.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          function Exit-Automation([string] $Reason) { [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "reason=$Reason`n", (New-Object Text.UTF8Encoding $false)); throw $Reason }
          $ReportPath = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/unreal-automation-report.json'
          if (-not (Test-Path -LiteralPath $ReportPath -PathType Leaf)) { Exit-Automation 'automation_report_missing' }
          $Report = Get-Item -LiteralPath $ReportPath
          if ($Report.Length -le 0 -or $Report.Length -gt 4MB) { Exit-Automation 'automation_report_size_invalid' }
          $ReportStream = [IO.File]::OpenRead($ReportPath)
          $Hasher = [Security.Cryptography.SHA256]::Create()
          try { $Digest = ([BitConverter]::ToString($Hasher.ComputeHash($ReportStream))).Replace('-', '').ToLowerInvariant() }
          finally { $Hasher.Dispose(); $ReportStream.Dispose() }
          $Utf8 = New-Object Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "artifact_name=unreal-automation-report`nevidence_sha256=$Digest`nevidence_size_bytes=$($Report.Length)`n", $Utf8)
      - name: Upload Unreal automation report
        id: automation_artifact
        if: steps.editor_build.outcome == 'success' && steps.automation_run.outcome == 'success' && steps.automation_residue.outcome == 'success' && steps.automation_identity.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unreal-automation-report
          path: ${{ runner.temp }}/aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/unreal-automation-report.json
          if-no-files-found: error
      # Expose the first automation failure as one fixed-vocabulary reason so a
      # red unreal receipt says why; runner-temp evidence is wiped after the job.
      - name: Report Unreal automation outcome
        id: automation_outcome
        continue-on-error: true
        timeout-minutes: 1
        shell: powershell
        working-directory: ${{ runner.temp }}
        env:
          AETHELN_EDITOR_BUILD_OUTCOME: ${{ steps.editor_build.outcome }}
          AETHELN_EDITOR_BUILD_REASON: ${{ steps.editor_build.outputs.reason }}
          AETHELN_RUN_OUTCOME: ${{ steps.automation_run.outcome }}
          AETHELN_RUN_REASON: ${{ steps.automation_run.outputs.reason }}
          AETHELN_RESIDUE_OUTCOME: ${{ steps.automation_residue.outcome }}
          AETHELN_RESIDUE_REASON: ${{ steps.automation_residue.outputs.reason }}
          AETHELN_BIND_OUTCOME: ${{ steps.automation_identity.outcome }}
          AETHELN_BIND_REASON: ${{ steps.automation_identity.outputs.reason }}
          AETHELN_UPLOAD_OUTCOME: ${{ steps.automation_artifact.outcome }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # First failed or cancelled step wins; an unrecorded failure (for
          # example a step timeout) maps to that step's fixed fallback.
          $Reason = 'none'
          foreach ($Step in @(
              @($env:AETHELN_EDITOR_BUILD_OUTCOME, $env:AETHELN_EDITOR_BUILD_REASON, 'editor_build_interrupted'),
              @($env:AETHELN_RUN_OUTCOME, $env:AETHELN_RUN_REASON, 'unreal_automation_interrupted'),
              @($env:AETHELN_RESIDUE_OUTCOME, $env:AETHELN_RESIDUE_REASON, 'automation_input_residue_interrupted'),
              @($env:AETHELN_BIND_OUTCOME, $env:AETHELN_BIND_REASON, 'automation_report_bind_interrupted'),
              @($env:AETHELN_UPLOAD_OUTCOME, '', 'automation_report_upload_failed'))) {
            if ($Step[0] -cin @('failure', 'cancelled')) {
              $Reason = if ([string] $Step[1] -cmatch '\A[a-z][a-z0-9_]{0,63}\z') { [string] $Step[1] } else { $Step[2] }
              break
            }
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "reason=$Reason`n", (New-Object Text.UTF8Encoding $false))
          Write-Output ('unreal_automation_outcome reason=' + $Reason)

  # Issue #150 milestone phases. The packaging and smoke milestone is split
  # into four bounded, schedule-only jobs (no manual trigger exists on this
  # workflow identity, so an older branch carrying the retired 1,440-minute
  # PackagedSmoke job can never be selected; no single-job package/smoke entry
  # point exists) that reacquire the shared aetheln-engine-runner concurrency
  # group at every phase boundary. Phase 1 needs quality-gates, so a portable
  # failure, cancellation, or skip keeps every phase off the runner. queue: max
  # keeps waiting jobs FIFO by wait-start time, so a queued
  # trusted-candidate-compile job can enter at the next phase boundary; this is
  # not an absolute priority and older queued jobs stay ahead of it. Job
  # timeout-minutes is the total concurrency-holding bound for each phase
  # (checkout, LFS, the gate script, and evidence upload all fit inside it).
  # The gate enforces a hard bound over its whole controlled script interval:
  # a supervising parent re-invokes the gate as a kill-on-close child tree
  # that runs the complete phase body — setup, handoff validation, cleanup
  # scanning, root accounting, manifest reads, payload hashing, smoke
  # discovery, the build/smoke work, and timeout finalization. The child keeps
  # the cooperative absolute script-phase deadline (every operation consumes
  # remaining time from it); if any synchronous operation or finalization
  # blocks across that deadline, the parent stops and verifies the whole tree
  # at the deadline plus a bounded finalization grace (default 120 s, capped
  # at 600 s), classifies phase_timeout (or phase_cleanup_failed when tree
  # termination cannot be verified), and writes the bounded report itself —
  # Report publication is best effort within the remaining job time: checkout,
  # LFS and finalization consume the same platform budget. Platform cancellation
  # or runner loss can prevent a report; missing evidence never means success.
  # Checkout/LFS and the report upload sit only inside the job bound: no
  # report can be preserved if the platform kills the job before the gate
  # script starts.
  # Packaged bytes move between phases only through the durable
  # AETHELN_HANDOFF_ROOT store with fail-closed integrity manifests; nothing
  # under it is deleted by CI.
  scheduled-client-package:
    if: github.event_name == 'schedule'
    needs: quality-gates
    runs-on: [self-hosted, Windows, X64, aetheln-engine]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: milestone
    concurrency:
      group: aetheln-engine-runner
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          path: milestone
          fetch-depth: 0
      - name: Fetch Unreal Content LFS objects
        shell: powershell
        run: git lfs pull --include "Content/**"
      - name: Run scheduled client packaging phase
        shell: powershell
        run: |
          $RunRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          powershell -NoProfile -File scripts/ci/Invoke-EngineRunnerGate.ps1 `
            -Mode PackageClient `
            -RepositoryRoot '${{ github.workspace }}/milestone' `
            -SourceRevision '${{ github.sha }}' `
            -LogRoot (Join-Path $RunRoot 'logs') `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -RunnerName '${{ runner.name }}' `
            -PhaseTimeoutMinutes 30
      - name: Upload engine-runner report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: engine-runner-client-package-report
          path: milestone/TestResults/engine-runner-report.json
          if-no-files-found: error

