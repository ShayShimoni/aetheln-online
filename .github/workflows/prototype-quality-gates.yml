          artifact-ids: ${{ needs.ci-selection-shadow.outputs.selector_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/aetheln-visual-selector
      - name: Download exact visual evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.visual-proof.outputs.report_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/aetheln-visual-evidence
      - name: Publish visual acceptance receipt
        id: receipt_identity
        shell: powershell
        env:
          AETHELN_REPOSITORY: ${{ github.repository }}
          AETHELN_ACTOR: ${{ github.actor }}
          AETHELN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AETHELN_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          AETHELN_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          AETHELN_TESTED_REVISION: ${{ github.sha }}
          AETHELN_RUN_ID: ${{ github.run_id }}
          AETHELN_RUN_ATTEMPT: ${{ github.run_attempt }}
          AETHELN_RAW_ARTIFACT_ID: ${{ needs.visual-proof.outputs.report_artifact_id }}
          AETHELN_RAW_ARTIFACT_NAME: ${{ needs.visual-proof.outputs.report_artifact_name }}
          AETHELN_RAW_ARTIFACT_DIGEST: ${{ needs.visual-proof.outputs.report_artifact_digest }}
          AETHELN_EVIDENCE_SHA256: ${{ needs.visual-proof.outputs.report_sha256 }}
          AETHELN_EVIDENCE_SIZE_BYTES: ${{ needs.visual-proof.outputs.report_size_bytes }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:AETHELN_RAW_ARTIFACT_ID -cnotmatch '\A[1-9][0-9]{0,19}\z' -or
              $env:AETHELN_RAW_ARTIFACT_NAME -cne ('visual-package-report-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT) -or
              $env:AETHELN_RAW_ARTIFACT_DIGEST -cnotmatch '\Asha256:[0-9a-f]{64}\z') { throw 'visual_raw_artifact_binding_invalid' }
          $ContextPath = Join-Path '${{ runner.temp }}' 'aetheln-visual-identity.json'
          $OutputRoot = Join-Path '${{ runner.temp }}' ('ci-receipt-visual-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT + '-${{ needs.ci-selection-shadow.outputs.attempt_nonce }}')
          $WorkflowPath = (Resolve-Path -LiteralPath '.github/workflows/prototype-quality-gates.yml').Path
          $ContextBuilder = (Resolve-Path -LiteralPath 'scripts/ci/New-CiAcceptanceAggregateContext.ps1').Path
          & $ContextBuilder `
            -Mode Identity `
            -SelectorReportPath '${{ runner.temp }}/aetheln-visual-selector/ci-selection-shadow.json' `
            -WorkflowPath $WorkflowPath `
            -Repository $env:AETHELN_REPOSITORY `
            -Actor $env:AETHELN_ACTOR `
            -TriggeringActor $env:AETHELN_TRIGGERING_ACTOR `
            -BaseRevision $env:AETHELN_BASE_REVISION `
            -HeadRevision $env:AETHELN_HEAD_REVISION `
            -TestedRevision $env:AETHELN_TESTED_REVISION `
            -WorkflowId $env:AETHELN_ACCEPTANCE_WORKFLOW_ID `
            -RunId $env:AETHELN_RUN_ID `
            -RunAttempt ([int] $env:AETHELN_RUN_ATTEMPT) `
            -ActionItemsJson $env:AETHELN_ACCEPTANCE_ACTION_ITEMS_JSON `
            -IdentityContextOutputPath $ContextPath | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ci/Publish-CiAcceptanceReceipt.ps1 `
            -ContextPath $ContextPath `
            -ProducerKey visual `
            -JobName visual-receipt-shadow `
            -EvidenceRoot '${{ runner.temp }}/aetheln-visual-evidence' `
            -ExpectedEvidenceSha256 $env:AETHELN_EVIDENCE_SHA256 `
            -ExpectedEvidenceSizeBytes ([long] $env:AETHELN_EVIDENCE_SIZE_BYTES) `
            -OutputRoot $OutputRoot
          if ($LASTEXITCODE -ne 0) { throw 'visual_receipt_failed' }
          $Utf8 = New-Object Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('artifact_name=' + (Split-Path -Leaf $OutputRoot) + "`n"), $Utf8)
      - name: Upload visual acceptance receipt
        id: receipt_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.receipt_identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.receipt_identity.outputs.artifact_name }}
          if-no-files-found: error

  # Package 3C reconciliation remains deliberately non-authoritative. It uses
  # direct-needs upload bindings for the accepted selector and each truthful
  # receipt publisher, then independently reconciles them against the GitHub
  # Actions API. A selector that requests any obligation without a live
  # producer writes an exact green no-acceptance gap. Unexpected identity,
  # download, semantic, API, serialization, or publication failures stay red.
  ci-acceptance-shadow:
    needs:
      - ci-selection-shadow
      - quality-gates
      - change-impact
      - trusted-candidate-compile
      - scheduled-client-package
      - scheduled-server-package
      - scheduled-provenance-validation
      - scheduled-packaged-smoke
      - visual-proof
      - portable-receipt-shadow
      - native-receipt-shadow
      - unreal-receipt-shadow
      - visual-receipt-shadow
    if: always()
    permissions:
      actions: read
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      complete: ${{ steps.reconcile.outputs.complete }}
      attempt_nonce: ${{ steps.reconcile.outputs.attempt_nonce }}
      artifact_id: ${{ steps.acceptance_artifact.outputs.artifact-id }}
      artifact_name: ${{ steps.reconcile.outputs.artifact_name }}
      artifact_digest: sha256:${{ steps.acceptance_artifact.outputs.artifact-digest }}
      report_sha256: ${{ steps.reconcile.outputs.report_sha256 }}
      report_size_bytes: ${{ steps.reconcile.outputs.report_size_bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'pull_request'
        with:
          lfs: false
          persist-credentials: false
      - name: Download exact selector evidence
        if: github.event_name == 'pull_request' && needs.ci-selection-shadow.outputs.selector_artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.ci-selection-shadow.outputs.selector_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/aetheln-aggregate-selector
      - name: Reconcile shadow acceptance evidence
        id: reconcile
        shell: powershell
        env:
          AETHELN_ACCEPTANCE_REPORT: ${{ runner.temp }}/ci-acceptance-shadow.json
          AETHELN_EVENT_NAME: ${{ github.event_name }}
          AETHELN_REPOSITORY: ${{ github.repository }}
          AETHELN_ACTOR: ${{ github.actor }}
          AETHELN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AETHELN_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          AETHELN_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          AETHELN_TESTED_REVISION: ${{ github.sha }}
          AETHELN_RUN_ID: ${{ github.run_id }}
          AETHELN_RUN_ATTEMPT: ${{ github.run_attempt }}
          AETHELN_SELECTOR_NONCE: ${{ needs.ci-selection-shadow.outputs.attempt_nonce }}
          AETHELN_SELECTOR_READY: ${{ needs.ci-selection-shadow.outputs.aggregate_ready }}
          AETHELN_SELECTOR_ARTIFACT_ID: ${{ needs.ci-selection-shadow.outputs.selector_artifact_id }}
          AETHELN_SELECTOR_ARTIFACT_NAME: ${{ needs.ci-selection-shadow.outputs.selector_artifact_name }}
          AETHELN_SELECTOR_ARTIFACT_DIGEST: ${{ needs.ci-selection-shadow.outputs.selector_artifact_digest }}
          AETHELN_PORTABLE_REQUIRED: ${{ needs.ci-selection-shadow.outputs.portable_required }}
          AETHELN_NATIVE_REQUIRED: ${{ needs.ci-selection-shadow.outputs.native_client_server_compile_required }}
          AETHELN_OPERATIONAL_REQUIRED: ${{ needs.ci-selection-shadow.outputs.controller_operational_proof_required }}
          AETHELN_UNREAL_REQUIRED: ${{ needs.ci-selection-shadow.outputs.unreal_editor_automation_required }}
          AETHELN_VISUAL_REQUIRED: ${{ needs.ci-selection-shadow.outputs.visual_package_required }}
          AETHELN_PORTABLE_RESULT: ${{ needs.portable-receipt-shadow.result }}
          AETHELN_PORTABLE_ARTIFACT_ID: ${{ needs.portable-receipt-shadow.outputs.artifact_id }}
          AETHELN_PORTABLE_ARTIFACT_NAME: ${{ needs.portable-receipt-shadow.outputs.artifact_name }}
          AETHELN_PORTABLE_ARTIFACT_DIGEST: ${{ needs.portable-receipt-shadow.outputs.artifact_digest }}
          AETHELN_NATIVE_RESULT: ${{ needs.native-receipt-shadow.result }}
          AETHELN_NATIVE_ARTIFACT_ID: ${{ needs.native-receipt-shadow.outputs.artifact_id }}
          AETHELN_NATIVE_ARTIFACT_NAME: ${{ needs.native-receipt-shadow.outputs.artifact_name }}
          AETHELN_NATIVE_ARTIFACT_DIGEST: ${{ needs.native-receipt-shadow.outputs.artifact_digest }}
          AETHELN_UNREAL_RESULT: ${{ needs.unreal-receipt-shadow.result }}
          AETHELN_UNREAL_ARTIFACT_ID: ${{ needs.unreal-receipt-shadow.outputs.artifact_id }}
          AETHELN_UNREAL_ARTIFACT_NAME: ${{ needs.unreal-receipt-shadow.outputs.artifact_name }}
          AETHELN_UNREAL_ARTIFACT_DIGEST: ${{ needs.unreal-receipt-shadow.outputs.artifact_digest }}
          AETHELN_VISUAL_RESULT: ${{ needs.visual-receipt-shadow.result }}
          AETHELN_VISUAL_ARTIFACT_ID: ${{ needs.visual-receipt-shadow.outputs.artifact_id }}
          AETHELN_VISUAL_ARTIFACT_NAME: ${{ needs.visual-receipt-shadow.outputs.artifact_name }}
          AETHELN_VISUAL_ARTIFACT_DIGEST: ${{ needs.visual-receipt-shadow.outputs.artifact_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $Utf8 = New-Object System.Text.UTF8Encoding $false

          function Write-AcceptanceGap {
            param([string] $Reason, [string[]] $SelectedUnsupported)
            $Report = [ordered]@{
              schemaVersion = 'aetheln.ci-acceptance-shadow-gap/v2'
              repository = $env:AETHELN_REPOSITORY
              revision = $env:AETHELN_TESTED_REVISION
              run = [ordered]@{ id = $env:AETHELN_RUN_ID; attempt = [int] $env:AETHELN_RUN_ATTEMPT }
              selectedUnsupported = @($SelectedUnsupported)
              decision = [ordered]@{
                complete = $false
                shadow = $true
                authoritative = $false
                grantsAcceptance = $false
                reason = $Reason
              }
            }
            if (Test-Path -LiteralPath $env:AETHELN_ACCEPTANCE_REPORT) { throw 'acceptance_report_preexists' }
            [IO.File]::WriteAllText($env:AETHELN_ACCEPTANCE_REPORT, (ConvertTo-Json -InputObject $Report -Depth 8 -Compress), $Utf8)
          }

          if ($env:AETHELN_EVENT_NAME -cne 'pull_request') {
            Write-AcceptanceGap -Reason 'event_not_applicable' -SelectedUnsupported @()
            $ArtifactName = 'ci-acceptance-shadow-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "complete=false`nattempt_nonce=`nartifact_name=$ArtifactName`n", $Utf8)
            exit 0
          }

          if ($env:AETHELN_SELECTOR_NONCE -cnotmatch '\A[0-9a-f]{64}\z' -or $env:AETHELN_SELECTOR_NONCE -cmatch '\A0{64}\z' -or
              $env:AETHELN_SELECTOR_ARTIFACT_ID -cnotmatch '\A[1-9][0-9]{0,19}\z' -or
              $env:AETHELN_SELECTOR_ARTIFACT_NAME -cne ('ci-selection-shadow-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT + '-' + $env:AETHELN_SELECTOR_NONCE) -or
              $env:AETHELN_SELECTOR_ARTIFACT_DIGEST -cnotmatch '\Asha256:[0-9a-f]{64}\z') {
            throw 'selector_direct_binding_invalid'
          }

          $SelectorPath = Join-Path '${{ runner.temp }}' 'aetheln-aggregate-selector/ci-selection-shadow.json'
          $IdentityPath = Join-Path '${{ runner.temp }}' 'aetheln-aggregate-identity.json'
          $ContextArguments = @{
            SelectorReportPath = $SelectorPath
            WorkflowPath = (Join-Path $env:GITHUB_WORKSPACE '.github/workflows/prototype-quality-gates.yml')
            Repository = $env:AETHELN_REPOSITORY
            Actor = $env:AETHELN_ACTOR
            TriggeringActor = $env:AETHELN_TRIGGERING_ACTOR
            BaseRevision = $env:AETHELN_BASE_REVISION
            HeadRevision = $env:AETHELN_HEAD_REVISION
            TestedRevision = $env:AETHELN_TESTED_REVISION
            WorkflowId = $env:AETHELN_ACCEPTANCE_WORKFLOW_ID
            RunId = $env:AETHELN_RUN_ID
            RunAttempt = [int] $env:AETHELN_RUN_ATTEMPT
            ActionItemsJson = $env:AETHELN_ACCEPTANCE_ACTION_ITEMS_JSON
            IdentityContextOutputPath = $IdentityPath
          }
          $ContextBuilder = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/New-CiAcceptanceAggregateContext.ps1'

          if ($env:AETHELN_SELECTOR_READY -ceq 'false') {
            $Gap = & $ContextBuilder -Mode Gap @ContextArguments
            if ($Gap.mode -cne 'Gap' -or $Gap.acceptedControllerUnavailable -isnot [bool] -or
                $Gap.attemptAnchor.nonce -cne $env:AETHELN_SELECTOR_NONCE) { throw 'selector_gap_identity_invalid' }
            $SelectedUnsupported = @($Gap.selectedUnsupported)
            if ($SelectedUnsupported.Count -eq 0) { throw 'aggregate_ready_contradiction' }
            Write-AcceptanceGap -Reason 'producer_contract_incomplete' -SelectedUnsupported $SelectedUnsupported
            Write-Warning ('acceptance_producer_gap:' + ($SelectedUnsupported -join ','))
          } elseif ($env:AETHELN_SELECTOR_READY -ceq 'true') {
            $ProducerBindings = New-Object Collections.Generic.List[object]
            function Add-ProducerBinding {
              param([string] $Required, [string] $Result, [string] $Key, [string] $JobName, [string] $ArtifactId, [string] $ArtifactName, [string] $Digest)
              if ($Required -ceq 'false') { return }
              if ($Required -cne 'true' -or $Result -cne 'success' -or
                  $ArtifactId -cnotmatch '\A[1-9][0-9]{0,19}\z' -or
                  $ArtifactName -cne ('ci-receipt-' + $Key + '-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT + '-' + $env:AETHELN_SELECTOR_NONCE) -or
                  $Digest -cnotmatch '\Asha256:[0-9a-f]{64}\z') { throw ('producer_direct_binding_invalid:' + $Key) }
              $ProducerBindings.Add([pscustomobject][ordered]@{ key=$Key; jobName=$JobName; artifactId=$ArtifactId; artifactName=$ArtifactName; digest=$Digest })
            }
            # The native publisher proves either native obligation from one compile report; any other output pair is invalid and fails closed.
            $NativeProducerRequired = if ($env:AETHELN_NATIVE_REQUIRED -ceq 'true' -or $env:AETHELN_OPERATIONAL_REQUIRED -ceq 'true') { 'true' } elseif ($env:AETHELN_NATIVE_REQUIRED -ceq 'false' -and $env:AETHELN_OPERATIONAL_REQUIRED -ceq 'false') { 'false' } else { 'invalid' }
            Add-ProducerBinding $NativeProducerRequired $env:AETHELN_NATIVE_RESULT 'native' 'native-receipt-shadow' $env:AETHELN_NATIVE_ARTIFACT_ID $env:AETHELN_NATIVE_ARTIFACT_NAME $env:AETHELN_NATIVE_ARTIFACT_DIGEST
            Add-ProducerBinding $env:AETHELN_PORTABLE_REQUIRED $env:AETHELN_PORTABLE_RESULT 'portable' 'portable-receipt-shadow' $env:AETHELN_PORTABLE_ARTIFACT_ID $env:AETHELN_PORTABLE_ARTIFACT_NAME $env:AETHELN_PORTABLE_ARTIFACT_DIGEST
            Add-ProducerBinding $env:AETHELN_UNREAL_REQUIRED $env:AETHELN_UNREAL_RESULT 'unreal' 'unreal-receipt-shadow' $env:AETHELN_UNREAL_ARTIFACT_ID $env:AETHELN_UNREAL_ARTIFACT_NAME $env:AETHELN_UNREAL_ARTIFACT_DIGEST
            Add-ProducerBinding $env:AETHELN_VISUAL_REQUIRED $env:AETHELN_VISUAL_RESULT 'visual' 'visual-receipt-shadow' $env:AETHELN_VISUAL_ARTIFACT_ID $env:AETHELN_VISUAL_ARTIFACT_NAME $env:AETHELN_VISUAL_ARTIFACT_DIGEST
            $SelectorBinding = [pscustomobject][ordered]@{
              jobName = 'ci-selection-shadow'
              artifactId = $env:AETHELN_SELECTOR_ARTIFACT_ID
              artifactName = $env:AETHELN_SELECTOR_ARTIFACT_NAME
              digest = $env:AETHELN_SELECTOR_ARTIFACT_DIGEST
            }
            $AggregateContextPath = Join-Path '${{ runner.temp }}' 'aetheln-aggregate-context.json'
            $RuntimeRequirementsPath = Join-Path '${{ runner.temp }}' 'aetheln-runtime-requirements.json'
            $AggregateArguments = @{
              Mode = 'Aggregate'
              RequirementsTemplatePath = (Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/ci-acceptance-requirements.json')
              SelectorBindingJson = ($SelectorBinding | ConvertTo-Json -Compress)
              ProducerBindingsJson = (ConvertTo-Json -InputObject ([object[]] $ProducerBindings.ToArray()) -Depth 4 -Compress)
              AggregateContextOutputPath = $AggregateContextPath
              RuntimeRequirementsOutputPath = $RuntimeRequirementsPath
            }
            & $ContextBuilder @ContextArguments @AggregateArguments | Out-Null
            $ContextJson = [IO.File]::ReadAllText($AggregateContextPath, $Utf8)
            $RequirementsJson = [IO.File]::ReadAllText($RuntimeRequirementsPath, $Utf8)
            . (Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/Invoke-CiAcceptanceAggregate.ps1') `
              -ContextJson $ContextJson `
              -RequirementsJson $RequirementsJson `
              -OutputPath $env:AETHELN_ACCEPTANCE_REPORT `
              -DeadlineSeconds 120
            $Aggregate = Invoke-CiAcceptanceAggregateMain
            if (-not $Aggregate.decision.complete -or -not $Aggregate.decision.shadow -or $Aggregate.decision.authoritative -or $Aggregate.decision.grantsAcceptance) {
              throw 'aggregate_shadow_decision_invalid'
            }
          } else {
            throw 'aggregate_ready_invalid'
          }

          $ArtifactName = 'ci-acceptance-shadow-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT + '-' + $env:AETHELN_SELECTOR_NONCE
          $PublishedReport = Get-Content -LiteralPath $env:AETHELN_ACCEPTANCE_REPORT -Raw | ConvertFrom-Json
          $Complete = ($PublishedReport.decision.complete -eq $true).ToString().ToLowerInvariant()
          $PublishedInfo = Get-Item -LiteralPath $env:AETHELN_ACCEPTANCE_REPORT
          if ($PublishedInfo.Length -le 0 -or $PublishedInfo.Length -gt 4MB) { throw 'acceptance_report_size_invalid' }
          $PublishedSha256 = (Get-FileHash -LiteralPath $PublishedInfo.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "complete=$Complete`nattempt_nonce=$env:AETHELN_SELECTOR_NONCE`nartifact_name=$ArtifactName`nreport_sha256=$PublishedSha256`nreport_size_bytes=$($PublishedInfo.Length)`n", $Utf8)
      - name: Upload shadow acceptance diagnostic
        id: acceptance_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-acceptance-shadow.json
          if-no-files-found: error

  # Dormant Package 3C activation boundary. The live shadow workflow keeps the
  # literal predicate false. A later externally checked one-file activation
  # candidate may replace the whole workflow only with the pre-reviewed
  # template whose sole semantic delta changes this literal to true.
  ci-acceptance-authority:
    needs: ci-acceptance-shadow
    if: always() && github.event_name == 'pull_request' && false
    permissions:
      actions: read
      contents: read
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require successful reconciled aggregate dependency
        shell: powershell
        env:
          AETHELN_AGGREGATE_RESULT: ${{ needs.ci-acceptance-shadow.result }}
        run: |
          if ($env:AETHELN_AGGREGATE_RESULT -cne 'success') { throw 'acceptance_authority_dependency_invalid' }
      - name: Download exact reconciled aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.ci-acceptance-shadow.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/aetheln-acceptance-authority
      - name: Grant acceptance only from the complete reconciled aggregate
        id: authority
        shell: powershell
        env:
          AETHELN_AGGREGATE_RESULT: ${{ needs.ci-acceptance-shadow.result }}
          AETHELN_AGGREGATE_COMPLETE: ${{ needs.ci-acceptance-shadow.outputs.complete }}
          AETHELN_AGGREGATE_ARTIFACT_ID: ${{ needs.ci-acceptance-shadow.outputs.artifact_id }}
          AETHELN_AGGREGATE_ARTIFACT_NAME: ${{ needs.ci-acceptance-shadow.outputs.artifact_name }}
          AETHELN_AGGREGATE_ARTIFACT_DIGEST: ${{ needs.ci-acceptance-shadow.outputs.artifact_digest }}
          AETHELN_AGGREGATE_REPORT_SHA256: ${{ needs.ci-acceptance-shadow.outputs.report_sha256 }}
          AETHELN_AGGREGATE_REPORT_SIZE_BYTES: ${{ needs.ci-acceptance-shadow.outputs.report_size_bytes }}
          AETHELN_ATTEMPT_NONCE: ${{ needs.ci-acceptance-shadow.outputs.attempt_nonce }}
          AETHELN_REPOSITORY: ${{ github.repository }}
          AETHELN_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          AETHELN_RUN_ID: ${{ github.run_id }}
          AETHELN_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $Utf8 = New-Object Text.UTF8Encoding($false, $true)
          $Utf8NoBom = New-Object Text.UTF8Encoding $false
          if ($env:AETHELN_AGGREGATE_RESULT -cne 'success' -or
              $env:AETHELN_AGGREGATE_COMPLETE -cne 'true' -or
              $env:AETHELN_AGGREGATE_ARTIFACT_ID -cnotmatch '\A[1-9][0-9]{0,19}\z' -or
              $env:AETHELN_ATTEMPT_NONCE -cnotmatch '\A[0-9a-f]{64}\z' -or $env:AETHELN_ATTEMPT_NONCE -cmatch '\A0{64}\z' -or
              $env:AETHELN_AGGREGATE_ARTIFACT_NAME -cne ('ci-acceptance-shadow-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT + '-' + $env:AETHELN_ATTEMPT_NONCE) -or
              $env:AETHELN_AGGREGATE_ARTIFACT_DIGEST -cnotmatch '\Asha256:[0-9a-f]{64}\z' -or
              $env:AETHELN_AGGREGATE_REPORT_SHA256 -cnotmatch '\A[0-9a-f]{64}\z' -or
              $env:AETHELN_AGGREGATE_REPORT_SIZE_BYTES -cnotmatch '\A[1-9][0-9]{0,9}\z') { throw 'acceptance_authority_binding_invalid' }
          $EvidenceRoot = Join-Path '${{ runner.temp }}' 'aetheln-acceptance-authority'
          $Entries = @(Get-ChildItem -LiteralPath $EvidenceRoot -Force)
          if ($Entries.Count -ne 1 -or $Entries[0].PSIsContainer -or $Entries[0].Name -cne 'ci-acceptance-shadow.json' -or
              $Entries[0].Length -le 0 -or $Entries[0].Length -gt 4MB) { throw 'acceptance_authority_inventory_invalid' }
          $AggregateSha256 = (Get-FileHash -LiteralPath $Entries[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Entries[0].Length -ne [int64] $env:AETHELN_AGGREGATE_REPORT_SIZE_BYTES -or
              $AggregateSha256 -cne $env:AETHELN_AGGREGATE_REPORT_SHA256) { throw 'acceptance_authority_evidence_mismatch' }
          try { $Aggregate = $Utf8.GetString([IO.File]::ReadAllBytes($Entries[0].FullName)) | ConvertFrom-Json }
          catch { throw 'acceptance_authority_report_invalid' }
          $ExpectedRoot = 'schemaVersion,repository,event,source,workflow,actions,controller,policy,selectorEvidence,run,attemptAnchor,jobs,receipts,decision'
          if ($Aggregate -isnot [pscustomobject] -or ($Aggregate.PSObject.Properties.Name -join ',') -cne $ExpectedRoot -or
              $Aggregate.schemaVersion -cne 'aetheln.ci-acceptance-aggregate/v1' -or
              $Aggregate.repository.fullName -cne $env:AETHELN_REPOSITORY -or
              $Aggregate.source.headRevision -cne $env:AETHELN_HEAD_REVISION -or
              $Aggregate.run.id -cne $env:AETHELN_RUN_ID -or [int] $Aggregate.run.attempt -ne [int] $env:AETHELN_RUN_ATTEMPT -or
              $Aggregate.attemptAnchor.nonce -cne $env:AETHELN_ATTEMPT_NONCE -or
              ($Aggregate.decision.PSObject.Properties.Name -join ',') -cne 'evidenceClass,complete,shadow,authoritative,grantsAcceptance,reason' -or
              $Aggregate.decision.evidenceClass -cne 'pull_request_acceptance_candidate' -or
              $Aggregate.decision.complete -ne $true -or $Aggregate.decision.shadow -ne $true -or
              $Aggregate.decision.authoritative -ne $false -or $Aggregate.decision.grantsAcceptance -ne $false -or
              $Aggregate.decision.reason -cne 'shadow_evidence_reconciled') { throw 'acceptance_authority_report_invalid' }
          $Authority = [ordered]@{
            schemaVersion = 'aetheln.ci-acceptance-authority/v1'
            repository = $env:AETHELN_REPOSITORY
            revision = $env:AETHELN_HEAD_REVISION
            run = [ordered]@{ id=$env:AETHELN_RUN_ID; attempt=[int]$env:AETHELN_RUN_ATTEMPT }
            attemptNonce = $env:AETHELN_ATTEMPT_NONCE
            aggregateSha256 = $AggregateSha256
            decision = [ordered]@{ complete=$true; authoritative=$true; grantsAcceptance=$true; reason='accepted_reconciled_aggregate' }
          }
          $OutputPath = Join-Path '${{ runner.temp }}' 'ci-acceptance-authority.json'
          if (Test-Path -LiteralPath $OutputPath) { throw 'acceptance_authority_output_exists' }
          [IO.File]::WriteAllText($OutputPath, (ConvertTo-Json $Authority -Depth 6 -Compress), $Utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('artifact_name=ci-acceptance-authority-' + $env:AETHELN_RUN_ID + '-' + $env:AETHELN_RUN_ATTEMPT + '-' + $env:AETHELN_ATTEMPT_NONCE + "`n"), $Utf8NoBom)
      - name: Upload acceptance authority receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.authority.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-acceptance-authority.json
          if-no-files-found: error
