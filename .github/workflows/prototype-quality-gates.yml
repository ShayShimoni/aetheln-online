name: Prototype quality gates

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  # Issue #167 Package 2 shadow selector. This independent PR-only diagnostic
  # never publishes outputs and no job consumes it. The immutable base, head,
  # and synthetic merge objects enter a bare control repository before the
  # only checkout, which sparsely materializes the accepted-base controller.
  # Candidate selector bytes are never checked out or executed. During the
  # bootstrap PR the accepted base has no controller, so a bounded,
  # conservative accepted_controller_unavailable record selects every check
  # without claiming equivalence or authorizing any later checkout.
  ci-selection-shadow:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      AETHELN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      AETHELN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AETHELN_WORKFLOW_SHA: ${{ github.sha }}
      AETHELN_REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
      AETHELN_ACCEPTED_CONTROL: ${{ github.workspace }}/ci-selection-control-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fetch immutable comparison objects
        shell: powershell
        env:
          AETHELN_GITHUB_TOKEN: ${{ github.token }}
          AETHELN_CONTROL_REPO: ${{ runner.temp }}/ci-selection-objects-${{ github.run_id }}-${{ github.run_attempt }}.git
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $BaseSha = [string] $env:AETHELN_PR_BASE_SHA
          $HeadSha = [string] $env:AETHELN_PR_HEAD_SHA
          $WorkflowSha = [string] $env:AETHELN_WORKFLOW_SHA
          foreach ($Revision in @($BaseSha, $HeadSha, $WorkflowSha)) {
            if ($Revision -cnotmatch '^[0-9a-f]{40}$') { throw 'invalid_revision' }
          }
          if (Test-Path -LiteralPath $env:AETHELN_CONTROL_REPO) { throw 'control_repository_preexists' }

          if ([string]::IsNullOrWhiteSpace($env:AETHELN_GITHUB_TOKEN)) { throw 'github_token_unavailable' }
          $Authorization = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes("x-access-token:$env:AETHELN_GITHUB_TOKEN")
          )
          Write-Output "::add-mask::$Authorization"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $Authorization"

          & git init --bare $env:AETHELN_CONTROL_REPO
          if ($LASTEXITCODE -ne 0) { throw 'control_repository_init_failed' }
          $Remote = [string] $env:AETHELN_REMOTE_URL
          try {
            foreach ($Fetch in @(
              @($BaseSha, 'refs/aetheln/base'),
              @($HeadSha, 'refs/aetheln/head'),
              @($WorkflowSha, 'refs/aetheln/workflow')
            )) {
              & git --git-dir=$env:AETHELN_CONTROL_REPO fetch --no-tags --depth=2 $Remote "+$($Fetch[0]):$($Fetch[1])"
              if ($LASTEXITCODE -ne 0) { throw 'immutable_object_fetch_failed' }
              $ResolvedOutput = @(& git --git-dir=$env:AETHELN_CONTROL_REPO rev-parse $Fetch[1] | ForEach-Object { "$_" })
              if ($LASTEXITCODE -ne 0 -or $ResolvedOutput.Count -ne 1 -or [string] $ResolvedOutput[0] -cne $Fetch[0]) { throw 'immutable_object_identity_mismatch' }
            }
          }
          finally {
            $env:GIT_CONFIG_COUNT = $null
            $env:GIT_CONFIG_KEY_0 = $null
            $env:GIT_CONFIG_VALUE_0 = $null
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: ci-selection-control-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout: scripts/ci/Get-CiSelection.ps1
          sparse-checkout-cone-mode: false
      - name: Produce shadow selection record
        shell: powershell
        env:
          AETHELN_CONTROL_REPO: ${{ runner.temp }}/ci-selection-objects-${{ github.run_id }}-${{ github.run_attempt }}.git
          AETHELN_SHADOW_REPORT: ${{ runner.temp }}/ci-selection-shadow.json
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $BaseSha = [string] $env:AETHELN_PR_BASE_SHA
          $HeadSha = [string] $env:AETHELN_PR_HEAD_SHA
          $WorkflowSha = [string] $env:AETHELN_WORKFLOW_SHA
          $SelectorPath = Join-Path $env:AETHELN_ACCEPTED_CONTROL 'scripts/ci/Get-CiSelection.ps1'
          $ContextPath = Join-Path '${{ runner.temp }}' 'ci-selection-context.json'
          $Utf8 = New-Object System.Text.UTF8Encoding $false
          $ControllerBlobOid = $null
          $ControllerSha256 = $null

          $Context = [ordered]@{
            kind = 'pull_request'
            baseRevision = $BaseSha
            headRevision = $HeadSha
            workflowRevision = $WorkflowSha
            controllerRevision = $BaseSha
          }
          [IO.File]::WriteAllText($ContextPath, (ConvertTo-Json -InputObject $Context -Compress), $Utf8)

          $BlobQuery = "${BaseSha}:scripts/ci/Get-CiSelection.ps1"
          $PreviousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $BlobOutput = @(& git --git-dir=$env:AETHELN_CONTROL_REPO rev-parse $BlobQuery 2>$null | ForEach-Object { "$_" })
            $BlobExitCode = $LASTEXITCODE
          }
          finally { $ErrorActionPreference = $PreviousPreference }
          if ($BlobExitCode -eq 0 -and $BlobOutput.Count -eq 1) { $ControllerBlobOid = [string] $BlobOutput[0] }

          if ($BlobExitCode -eq 0 -and $ControllerBlobOid -cmatch '^[0-9a-f]{40,64}$') {
            if (-not (Test-Path -LiteralPath $SelectorPath -PathType Leaf)) { throw 'accepted_controller_checkout_missing' }
            $CheckedOutBlob = [string] @(& git -C $env:AETHELN_ACCEPTED_CONTROL hash-object --no-filters -- scripts/ci/Get-CiSelection.ps1)[0]
            if ($LASTEXITCODE -ne 0 -or $CheckedOutBlob -cne $ControllerBlobOid) { throw 'accepted_controller_byte_mismatch' }
            $ControllerSha256 = (Get-FileHash -LiteralPath $SelectorPath -Algorithm SHA256).Hash.ToLowerInvariant()
            powershell -NoProfile -File $SelectorPath -ContextJson $ContextPath -OutputPath $env:AETHELN_SHADOW_REPORT -RepositoryRoot $env:AETHELN_CONTROL_REPO
            if ($LASTEXITCODE -ne 0) { throw 'accepted_controller_failed' }
          }
          else {
            $CheckIds = @(
              'portable',
              'visual-package',
              'delivery-harness',
              'native-client-server-compile',
              'unreal-editor-automation',
              'content-reference-validation',
              'controller-contract',
              'controller-operational-proof',
              'clean-package-provenance-smoke'
            )
            $Obligations = @($CheckIds | ForEach-Object {
              [ordered]@{ id = $_; selected = $true; reasons = @('accepted_controller_unavailable') }
            })
            $Report = [ordered]@{
              schemaVersion = 'aetheln.ci-selection/v1'
              policy = [ordered]@{ version = 'shadow-v1'; digest = ('0' * 64); checkIds = $CheckIds }
              source = [ordered]@{ kind = 'pull_request'; callerKind = $null; baseRevision = $BaseSha; headRevision = $HeadSha; workflowRevision = $WorkflowSha; revision = $null }
              execution = [ordered]@{
                mode = 'accepted_controller_unavailable'
                controllerRevision = $BaseSha
                controllerBlobOid = $null
                controllerSha256 = $null
                checkoutAllowed = $false
                complete = $true
                reason = 'accepted_controller_unavailable'
              }
              classification = [ordered]@{ changedPaths = @(); entries = @(); uncertainties = @('accepted_controller_unavailable') }
              selection = [ordered]@{ shadow = $true; authoritative = $false; obligations = $Obligations }
              legacyAuthority = [ordered]@{ authoritative = $true; engineRequired = $null; reason = 'not_observed' }
              comparison = [ordered]@{ status = 'unavailable'; differences = @('accepted_controller_unavailable') }
            }
            [IO.File]::WriteAllText($env:AETHELN_SHADOW_REPORT, (ConvertTo-Json -InputObject $Report -Depth 8), $Utf8)
          }

          if (-not (Test-Path -LiteralPath $env:AETHELN_SHADOW_REPORT -PathType Leaf)) { throw 'shadow_report_missing' }
          $ReportInfo = Get-Item -LiteralPath $env:AETHELN_SHADOW_REPORT
          if ($ReportInfo.Length -le 0 -or $ReportInfo.Length -gt 4MB) { throw 'shadow_report_size_invalid' }
          $Parsed = Get-Content -LiteralPath $env:AETHELN_SHADOW_REPORT -Raw | ConvertFrom-Json
          if ($Parsed.selection.shadow -ne $true -or $Parsed.selection.authoritative -ne $false) { throw 'shadow_report_authority_invalid' }
          if ($null -ne $ControllerBlobOid) {
            if ([string] $Parsed.execution.controllerBlobOid -cne $ControllerBlobOid -or [string] $Parsed.execution.controllerSha256 -cne $ControllerSha256) {
              throw 'shadow_report_controller_identity_mismatch'
            }
          }
      - name: Upload shadow selection record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-selection-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-selection-shadow.json
          if-no-files-found: error

  quality-gates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch StarterMap LFS object
        shell: powershell
        run: git lfs pull --include "Content/Maps/StarterMap.umap"
      - name: Run CI suite
        shell: powershell
        run: powershell -NoProfile -File scripts/ci/Invoke-CiSuite.ps1
      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: TestResults/ci-report.json

  # Issue #150 pull-request change-impact classifier. GitHub-hosted, checkout
  # plus repository-owned PowerShell only. It compares the exact pull-request
  # base and head SHAs (passed through env, never interpolated into the
  # script) and skips trusted Unreal compilation only when every changed path
  # belongs to the closed portable-only set. Every uncertainty — invalid or
  # missing SHAs, unreachable commits, Git errors, an empty diff, a quoted or
  # rename/copy diff entry — fails closed to engine_required=true, and the
  # step always exits 0 so the decision is always published.
  change-impact:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      engine_required: ${{ steps.classify.outputs.engine_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Classify changed paths
        id: classify
        shell: powershell
        env:
          AETHELN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AETHELN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $EngineRequired = $true
          $Reason = 'classifier_error'
          $Detail = ''

          function Invoke-GitRaw([string[]] $Arguments) {
            $Previous = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $Output = @(& git @Arguments 2>&1 | ForEach-Object { "$_" })
              $ExitCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $Previous
            }
            return @{ Output = $Output; ExitCode = $ExitCode }
          }

          function Test-PortablePath([string] $Path) {
            # Closed portable-only set (case-sensitive). These exact CI files
            # are checked by the required portable suites and independent review;
            # an Unreal compile does not validate their scheduling or YAML logic.
            # Other scripts/workflows and all engine inputs still require compile.
            $PortableCiPaths = @(
              'scripts/ci/Invoke-CiSuite.ps1',
              'scripts/ci/Test-FormattingPolicy.ps1',
              'scripts/ci/Test-MarkdownLinks.ps1',
              'scripts/build/Build-PackagedArtifacts.ps1',
              'scripts/build/Invoke-PackagedSmokeTest.ps1',
              'scripts/ci/Invoke-EngineRunnerGate.ps1',
              'scripts/ci/Initialize-CompileWorkspace.ps1',
              '.github/workflows/prototype-quality-gates.yml'
            )
            if ($PortableCiPaths -ccontains $Path) { return $true }
            if ($Path -cmatch '^docs/.+') { return $true }
            if ($Path -cmatch '^visuals/.+') { return $true }
            if ($Path -cmatch '^output/pdf/.+') { return $true }
            if ($Path -cmatch '^tests/.+\.(ps1|md)$') { return $true }
            if ($Path -cmatch '^[^/]+\.md$') { return $true }
            if ($Path -cmatch '^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/[^/]+\.(md|yml|yaml)$') { return $true }
            if ($Path -cmatch '^\.github/(PULL_REQUEST_TEMPLATE|pull_request_template)\.md$') { return $true }
            return $false
          }

          try {
            $BaseSha = [string] $env:AETHELN_PR_BASE_SHA
            $HeadSha = [string] $env:AETHELN_PR_HEAD_SHA
            if ($BaseSha -cnotmatch '^[0-9a-f]{40}$' -or $HeadSha -cnotmatch '^[0-9a-f]{40}$') { throw 'invalid_sha' }
            if ($BaseSha -eq $HeadSha) { throw 'identical_shas' }
            foreach ($Revision in @($BaseSha, $HeadSha)) {
              if ((Invoke-GitRaw @('cat-file', '-e', "$Revision^{commit}")).ExitCode -ne 0) {
                $null = Invoke-GitRaw @('fetch', '--no-tags', '--depth=1', 'origin', $Revision)
                if ((Invoke-GitRaw @('cat-file', '-e', "$Revision^{commit}")).ExitCode -ne 0) { throw 'commit_unavailable' }
              }
            }
            $Diff = Invoke-GitRaw @('diff', '--name-status', '--no-renames', $BaseSha, $HeadSha)
            if ($Diff.ExitCode -ne 0) { throw 'diff_failed' }
            $Entries = @($Diff.Output | Where-Object { $_ -ne '' })
            if ($Entries.Count -eq 0) { throw 'empty_diff' }
            $EnginePaths = @()
            foreach ($Entry in $Entries) {
              if ($Entry -cnotmatch '^[AMDT]\t([^\t"]+)$') { throw 'unexpected_diff_entry' }
              if (-not (Test-PortablePath $Matches[1])) { $EnginePaths += $Matches[1] }
            }
            if ($EnginePaths.Count -gt 0) {
              $Reason = 'engine_paths_changed'
              $Detail = (@($EnginePaths | Select-Object -First 20) -join ', ')
            }
            else {
              $EngineRequired = $false
              $Reason = 'portable_paths_only'
              $Detail = "$($Entries.Count) portable path(s)"
            }
          }
          catch {
            $EngineRequired = $true
            $Message = [string] $_.Exception.Message
            $Known = @('invalid_sha', 'identical_shas', 'commit_unavailable', 'diff_failed', 'empty_diff', 'unexpected_diff_entry')
            if ($Known -contains $Message) { $Reason = $Message } else { $Reason = 'classifier_error' }
          }

          $Flag = if ($EngineRequired) { 'true' } else { 'false' }
          $Utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "engine_required=$Flag`nreason=$Reason`n", $Utf8)
          $Summary = "Change impact: engine_required=$Flag (reason: $Reason)."
          if ($Detail) { $Summary = "Change impact: engine_required=$Flag (reason: ${Reason}; $Detail)." }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$Summary`n", $Utf8)
          Write-Output $Summary
          exit 0

  # Trusted compile starts only after the portable gates passed and the
  # classifier demanded the engine (implicit success on both needs edges; no
  # status-function bypass). A portable failure, a cancellation, or a skipped
  # prerequisite keeps it off the engine runner.
  trusted-candidate-compile:
    needs:
      - quality-gates
      - change-impact
    if: >-
      github.event_name == 'pull_request' &&
      needs.change-impact.outputs.engine_required == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, aetheln-engine]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: compile-control-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: aetheln-engine-runner
      queue: max
      cancel-in-progress: false
    steps:
      - name: Capture routine compile deadline
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $StartedTimestamp = [Diagnostics.Stopwatch]::GetTimestamp()
          $StartedUtc = [DateTime]::UtcNow.ToString('o', [Globalization.CultureInfo]::InvariantCulture)
          $Utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_ENV, "AETHELN_COMPILE_STARTED_UTC=$StartedUtc`nAETHELN_COMPILE_STARTED_TIMESTAMP=$StartedTimestamp`n", $Utf8)
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          lfs: false
          ref: ${{ github.sha }}
          path: compile-control-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Compile supported client and server targets
        shell: powershell
        env:
          AETHELN_MANAGED_COMPILE_ROOT: ${{ vars.AETHELN_MANAGED_COMPILE_ROOT }}
          AETHELN_MANAGED_COMPILE_REGISTRATION: ${{ vars.AETHELN_MANAGED_COMPILE_REGISTRATION }}
          AETHELN_MANAGED_COMPILE_REGISTRATION_SHA256: ${{ vars.AETHELN_MANAGED_COMPILE_REGISTRATION_SHA256 }}
          AETHELN_ENGINE_HOST_LEASE: ${{ vars.AETHELN_ENGINE_HOST_LEASE }}
        run: |
          $RunRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          powershell -NoProfile -File scripts/ci/Invoke-EngineRunnerGate.ps1 `
            -Mode Compile `
            -RepositoryRoot '${{ github.workspace }}/compile-control-${{ github.run_id }}-${{ github.run_attempt }}' `
            -SourceRevision '${{ github.sha }}' `
            -Repository '${{ github.repository }}' `
            -RunnerName '${{ runner.name }}' `
            -ManagedWorkspaceRoot $env:AETHELN_MANAGED_COMPILE_ROOT `
            -ManagedWorkspaceRegistrationPath $env:AETHELN_MANAGED_COMPILE_REGISTRATION `
            -ManagedWorkspaceRegistrationSha256 $env:AETHELN_MANAGED_COMPILE_REGISTRATION_SHA256 `
            -HostLeasePath $env:AETHELN_ENGINE_HOST_LEASE `
            -CompileStartedUtc $env:AETHELN_COMPILE_STARTED_UTC `
            -CompileStartedTimestamp $env:AETHELN_COMPILE_STARTED_TIMESTAMP `
            -ArchiveRoot (Join-Path $RunRoot 'archives') `
            -LogRoot (Join-Path $RunRoot 'logs') `
            -CompileTimeoutMinutes 30 `
            -ReportPath (Join-Path $RunRoot 'engine-runner-report.json')
      - name: Upload engine-runner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-runner-compile-report
          path: ${{ runner.temp }}/aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/engine-runner-report.json
          if-no-files-found: error

  # Issue #150 milestone phases. The packaging and smoke milestone is split
  # into four bounded, schedule-only jobs (no manual trigger exists on this
  # workflow identity, so an older branch carrying the retired 1,440-minute
  # PackagedSmoke job can never be selected; no single-job package/smoke entry
  # point exists) that reacquire the shared aetheln-engine-runner concurrency
  # group at every phase boundary. Phase 1 needs quality-gates, so a portable
  # failure, cancellation, or skip keeps every phase off the runner. queue: max
  # keeps waiting jobs FIFO by wait-start time, so a queued
  # trusted-candidate-compile job can enter at the next phase boundary; this is
  # not an absolute priority and older queued jobs stay ahead of it. Job
  # timeout-minutes is the total concurrency-holding bound for each phase
  # (checkout, LFS, the gate script, and evidence upload all fit inside it).
  # The gate enforces a hard bound over its whole controlled script interval:
  # a supervising parent re-invokes the gate as a kill-on-close child tree
  # that runs the complete phase body — setup, handoff validation, cleanup
  # scanning, root accounting, manifest reads, payload hashing, smoke
  # discovery, the build/smoke work, and timeout finalization. The child keeps
  # the cooperative absolute script-phase deadline (every operation consumes
  # remaining time from it); if any synchronous operation or finalization
  # blocks across that deadline, the parent stops and verifies the whole tree
  # at the deadline plus a bounded finalization grace (default 120 s, capped
  # at 600 s), classifies phase_timeout (or phase_cleanup_failed when tree
  # termination cannot be verified), and writes the bounded report itself —
  # Report publication is best effort within the remaining job time: checkout,
  # LFS and finalization consume the same platform budget. Platform cancellation
  # or runner loss can prevent a report; missing evidence never means success.
  # Checkout/LFS and the report upload sit only inside the job bound: no
  # report can be preserved if the platform kills the job before the gate
  # script starts.
  # Packaged bytes move between phases only through the durable
  # AETHELN_HANDOFF_ROOT store with fail-closed integrity manifests; nothing
  # under it is deleted by CI.
  scheduled-client-package:
    if: github.event_name == 'schedule'
    needs: quality-gates
    runs-on: [self-hosted, Windows, X64, aetheln-engine]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: milestone
    concurrency:
      group: aetheln-engine-runner
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          path: milestone
          fetch-depth: 0
      - name: Fetch Unreal Content LFS objects
        shell: powershell
        run: git lfs pull --include "Content/**"
      - name: Run scheduled client packaging phase
        shell: powershell
        run: |
          $RunRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          powershell -NoProfile -File scripts/ci/Invoke-EngineRunnerGate.ps1 `
            -Mode PackageClient `
            -RepositoryRoot '${{ github.workspace }}/milestone' `
            -SourceRevision '${{ github.sha }}' `
            -LogRoot (Join-Path $RunRoot 'logs') `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -RunnerName '${{ runner.name }}' `
            -PhaseTimeoutMinutes 30
      - name: Upload engine-runner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-runner-client-package-report
          path: milestone/TestResults/engine-runner-report.json
          if-no-files-found: error

  scheduled-server-package:
    if: github.event_name == 'schedule'
    needs: scheduled-client-package
    runs-on: [self-hosted, Windows, X64, aetheln-engine]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: milestone
    concurrency:
      group: aetheln-engine-runner
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          path: milestone
          fetch-depth: 0
      - name: Fetch Unreal Content LFS objects
        shell: powershell
        run: git lfs pull --include "Content/**"
      - name: Run scheduled server packaging phase
        shell: powershell
        run: |
          $RunRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          powershell -NoProfile -File scripts/ci/Invoke-EngineRunnerGate.ps1 `
            -Mode PackageServer `
            -RepositoryRoot '${{ github.workspace }}/milestone' `
            -SourceRevision '${{ github.sha }}' `
            -LogRoot (Join-Path $RunRoot 'logs') `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -RunnerName '${{ runner.name }}' `
            -PhaseTimeoutMinutes 30
      - name: Upload engine-runner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-runner-server-package-report
          path: milestone/TestResults/engine-runner-report.json
          if-no-files-found: error

  scheduled-provenance-validation:
    if: github.event_name == 'schedule'
    needs: scheduled-server-package
    runs-on: [self-hosted, Windows, X64, aetheln-engine]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: milestone
    concurrency:
      group: aetheln-engine-runner
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          path: milestone
          fetch-depth: 0
      - name: Run scheduled registry and provenance validation phase
        shell: powershell
        run: |
          $RunRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          powershell -NoProfile -File scripts/ci/Invoke-EngineRunnerGate.ps1 `
            -Mode ValidateProvenance `
            -RepositoryRoot '${{ github.workspace }}/milestone' `
            -SourceRevision '${{ github.sha }}' `
            -LogRoot (Join-Path $RunRoot 'logs') `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -RunnerName '${{ runner.name }}' `
            -PhaseTimeoutMinutes 10
      - name: Upload engine-runner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-runner-provenance-validation-report
          path: milestone/TestResults/engine-runner-report.json
          if-no-files-found: error

  scheduled-packaged-smoke:
    if: github.event_name == 'schedule'
    needs: scheduled-provenance-validation
    runs-on: [self-hosted, Windows, X64, aetheln-engine]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: milestone
    concurrency:
      group: aetheln-engine-runner
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          path: milestone
          fetch-depth: 0
      - name: Run scheduled packaged smoke phase
        shell: powershell
        run: |
          $RunRoot = Join-Path '${{ runner.temp }}' 'aetheln-engine-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          powershell -NoProfile -File scripts/ci/Invoke-EngineRunnerGate.ps1 `
            -Mode SmokePhase `
            -RepositoryRoot '${{ github.workspace }}/milestone' `
            -SourceRevision '${{ github.sha }}' `
            -LogRoot (Join-Path $RunRoot 'logs') `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -RunnerName '${{ runner.name }}' `
            -PhaseTimeoutMinutes 10
      - name: Upload engine-runner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-runner-scheduled-smoke-report
          path: milestone/TestResults/engine-runner-report.json
          if-no-files-found: error
